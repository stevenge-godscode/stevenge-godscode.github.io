<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Genesis · Apple-style Preview v7</title>
<style>html,body{margin:0;background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}.loading{height:100vh;display:grid;place-items:center;color:#86868b;font-size:14px}</style>
</head>
<body><div class="loading">Loading preview…</div>
<script>
(async()=>{
  const r=await fetch('apple-style-preview-v6.html?v=6',{cache:'no-store'});
  let html=await r.text();
  const css=`<style id="apple-v7">
  /* v7 — component system and overall visual unification */
  .components{background:#f5f5f7;padding:74px 0 72px}
  .components .section-kicker{margin-bottom:10px}
  .components h2{font-size:clamp(31px,3.15vw,40px);line-height:1.14;letter-spacing:-.018em}
  .component-grid{display:block;width:min(1300px,100%);margin:38px auto 0}
  .component-card{display:none}
  .platform-duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .platform-panel{position:relative;min-height:610px;border-radius:34px;overflow:hidden;padding:38px;background:#fff;color:#1d1d1f}
  .platform-panel.dark{background:#000;color:#f5f5f7}
  .platform-copy{position:relative;z-index:3;max-width:430px}
  .platform-copy small{display:block;font-size:11px;color:#8b8e94;letter-spacing:.07em;margin-bottom:10px}
  .platform-copy h3{margin:0;font-size:32px;line-height:1.1;letter-spacing:-.022em;font-weight:650}
  .platform-copy p{margin:10px 0 0;font-size:16px;line-height:1.5;color:#73777d;max-width:380px}
  .dark .platform-copy p{color:#a1a1a6}
  .platform-visual{position:absolute;left:28px;right:28px;bottom:26px;height:370px;border-radius:26px;overflow:hidden}
  .data-visual{background:linear-gradient(180deg,#f8fbff,#eef3fa);border:1px solid #e3e8f0}
  .data-columns{position:absolute;inset:26px;display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:10px;align-items:center}
  .data-col{display:grid;gap:9px}
  .data-chip{min-height:64px;padding:14px 15px;border-radius:15px;background:rgba(255,255,255,.88);border:1px solid #e2e6ec;box-shadow:0 8px 24px rgba(38,55,83,.04)}
  .data-chip small{display:block;font-size:9px;color:#959aa2}.data-chip b{display:block;font-size:13px;margin-top:6px}
  .data-core{height:205px;border-radius:24px;background:linear-gradient(155deg,#0e1117,#243047);color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:0 24px 55px rgba(30,44,72,.2)}
  .data-core small{font-size:9px;color:#8290a7;letter-spacing:.09em}.data-core strong{font-size:23px;margin-top:10px}.data-core span{font-size:11px;color:#b7c0ce;margin-top:8px}
  .data-stream{position:absolute;left:8%;right:8%;top:50%;height:1px;background:linear-gradient(90deg,transparent,#86b9f9 20%,#2997ff 50%,#86b9f9 80%,transparent)}
  .ontology-visual{background:radial-gradient(circle at 50% 45%,rgba(41,151,255,.18),transparent 36%),linear-gradient(180deg,#111318,#08090b);border:1px solid #20242b}
  .semantic-center{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);width:210px;height:210px;border-radius:50%;border:1px solid rgba(85,164,255,.4);background:radial-gradient(circle,rgba(41,151,255,.2),rgba(41,151,255,.04) 52%,transparent 70%);display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;box-shadow:0 0 70px rgba(41,151,255,.12)}
  .semantic-center small{font-size:9px;color:#7e8ea7;letter-spacing:.09em}.semantic-center strong{font-size:21px;margin-top:9px}.semantic-center span{font-size:10px;color:#98a4b6;margin-top:7px}
  .semantic-orbit{position:absolute;inset:28px}
  .semantic-node{position:absolute;min-width:112px;padding:12px 13px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.045);color:#d6dce6;font-size:11px;text-align:center}
  .semantic-node:nth-child(1){left:4%;top:16%}.semantic-node:nth-child(2){right:3%;top:19%}.semantic-node:nth-child(3){left:8%;bottom:15%}.semantic-node:nth-child(4){right:6%;bottom:13%}
  .semantic-ring{position:absolute;left:50%;top:50%;width:380px;height:240px;transform:translate(-50%,-50%);border:1px solid rgba(117,181,255,.16);border-radius:50%}
  .extension-strip{margin-top:12px;display:grid;grid-template-columns:1.2fr .8fr;gap:12px}
  .extension-panel{position:relative;min-height:270px;border-radius:30px;background:#fff;padding:32px;overflow:hidden}
  .extension-panel.dark{background:#111318;color:#f5f5f7}
  .extension-panel h3{margin:0;font-size:27px;line-height:1.12;letter-spacing:-.018em;font-weight:650}
  .extension-panel p{margin:8px 0 0;color:#74777d;font-size:15px;line-height:1.5;max-width:440px}
  .extension-panel.dark p{color:#a1a1a6}
  .pack-ribbon{display:flex;gap:9px;align-items:center;position:absolute;left:32px;right:32px;bottom:34px;overflow:hidden}
  .pack-tile{flex:1;min-width:0;padding:17px 16px;border-radius:16px;background:#f4f6f9;border:1px solid #e5e7eb}
  .pack-tile small{display:block;color:#90949a;font-size:9px}.pack-tile b{display:block;margin-top:6px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .api-line{position:absolute;left:32px;right:32px;bottom:34px;height:96px;border-radius:17px;background:#090b0f;border:1px solid #282d36;padding:20px;color:#b7c4d8;font:12px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace}
  .api-line b{color:#79b8ff}.api-line span{color:#748093}
  /* reduce repeated container chrome */
  .product-stage,.architecture-stage{border-width:1px}
  .scene-tags{opacity:.78}.scene-tag{font-size:10px;padding:7px 11px}
  footer{padding-top:24px}
  @media(max-width:900px){.platform-duo,.extension-strip{grid-template-columns:1fr}.platform-panel{min-height:560px}.extension-panel{min-height:250px}}
  @media(max-width:620px){
    .components{padding:54px 0 50px}.components h2{font-size:27px}.component-grid{width:calc(100% + 8px);margin-left:-4px;margin-top:26px}.platform-duo,.extension-strip{gap:8px}
    .platform-panel{min-height:450px;border-radius:24px;padding:24px}.platform-copy h3{font-size:25px}.platform-copy p{font-size:14px}.platform-visual{left:16px;right:16px;bottom:16px;height:270px;border-radius:18px}
    .data-columns{inset:14px;grid-template-columns:1fr;gap:6px}.data-col{display:none}.data-core{height:220px}.data-stream{display:none}
    .semantic-center{width:155px;height:155px}.semantic-center strong{font-size:18px}.semantic-ring{width:255px;height:180px}.semantic-node{min-width:84px;padding:9px 10px;font-size:9px}.semantic-node:nth-child(1){left:1%;top:11%}.semantic-node:nth-child(2){right:0;top:15%}.semantic-node:nth-child(3){left:3%;bottom:9%}.semantic-node:nth-child(4){right:2%;bottom:7%}
    .extension-panel{min-height:225px;border-radius:22px;padding:24px}.extension-panel h3{font-size:23px}.extension-panel p{font-size:14px}.pack-ribbon{left:20px;right:20px;bottom:22px;gap:6px}.pack-tile{padding:12px}.pack-tile:nth-child(3){display:none}.api-line{left:20px;right:20px;bottom:22px;height:88px;padding:16px;font-size:10px}
  }
  </style>`;
  const enhance=`<script id="v7-enhance">(()=>{
    const grid=document.querySelector('.component-grid');
    if(grid){grid.insertAdjacentHTML('beforeend',`<div class="platform-duo">
      <section class="platform-panel"><div class="platform-copy"><small>DATA FOUNDATION</small><h3>Data Platform</h3><p>连接数据 保留质量 血缘和版本</p></div><div class="platform-visual data-visual"><div class="data-stream"></div><div class="data-columns"><div class="data-col"><div class="data-chip"><small>SOURCE</small><b>Database</b></div><div class="data-chip"><small>SOURCE</small><b>API</b></div><div class="data-chip"><small>SOURCE</small><b>Documents</b></div></div><div class="data-core"><small>GOVERNED DATA</small><strong>Data Products</strong><span>Catalog · Quality · Lineage</span></div><div class="data-col"><div class="data-chip"><small>OUTPUT</small><b>Versioned Read</b></div><div class="data-chip"><small>OUTPUT</small><b>Materialization</b></div><div class="data-chip"><small>OUTPUT</small><b>Evidence Pointer</b></div></div></div></div></section>
      <section class="platform-panel dark"><div class="platform-copy"><small>BUSINESS CONTEXT</small><h3>Ontology Platform</h3><p>把数据组织成对象 事实 证据和能力</p></div><div class="platform-visual ontology-visual"><div class="semantic-ring"></div><div class="semantic-orbit"><div class="semantic-node">Object</div><div class="semantic-node">Evidence</div><div class="semantic-node">Fact</div><div class="semantic-node">Capability</div></div><div class="semantic-center"><small>SEMANTIC RUNTIME</small><strong>Business Context</strong><span>Workspace · Trace</span></div></div></section>
    </div><div class="extension-strip"><section class="extension-panel"><h3>Domain Packs</h3><p>把一个领域的模型 规则 方法和能力作为版本化扩展装进平台</p><div class="pack-ribbon"><div class="pack-tile"><small>MARKET</small><b>quant_investment_cn</b></div><div class="pack-tile"><small>OPS</small><b>observability_inspection</b></div><div class="pack-tile"><small>YOUR DOMAIN</small><b>your_domain_pack</b></div></div></section><section class="extension-panel dark"><h3>Capability API</h3><p>让现有 App Agent 和流程直接调用</p><div class="api-line"><span>POST</span> <b>/capabilities/invoke</b><br>→ result + evidence + trace</div></section></div>`)}
  })();<\/script>`;
  html=html.replace('</head>',css+'</head>').replace('</body>',enhance+'</body>').replace('Apple-style Preview v6','Apple-style Preview v7').replace(/v6/g,'v7');
  document.open();document.write(html);document.close();
})().catch(()=>{document.body.innerHTML='<div class="loading">Preview failed to load</div>'});
</script></body></html>
