tyle,{left:from.left+"px",top:from.top+"px",width:from.width+"px",height:from.height+"px",borderRadius:expand?"15px":"0px",filter:expand?"blur(0px) saturate(1)":"blur(11px) saturate(.82)",opacity:expand?"1":".24",zIndex:String(z||95)});document.body.appendChild(clone);const legend=clone.querySelector(".legend-base");if(legend)legend.animate(expand?[{opacity:1},{opacity:0}]:[{opacity:0},{opacity:1}],{duration:Math.round(duration*.7),fill:"forwards",easing:"ease"});const keyframes=expand?[{left:from.left+"px",top:from.top+"px",width:from.width+"px",height:from.height+"px",borderRadius:"15px",filter:"blur(0px) saturate(1)",opacity:1},{offset:.42,filter:"blur(2px) saturate(.94)",opacity:.72},{left:to.left+"px",top:to.top+"px",width:to.width+"px",height:to.height+"px",borderRadius:"0px",filter:"blur(11px) saturate(.82)",opacity:.24}]:[{left:from.left+"px",top:from.top+"px",width:from.width+"px",height:from.height+"px",borderRadius:"0px",filter:"blur(11px) saturate(.82)",opacity:.24},{offset:.58,filter:"blur(2px) saturate(.94)",opacity:.72},{left:to.left+"px",top:to.top+"px",width:to.width+"px",height:to.height+"px",borderRadius:"15px",filter:"blur(0px) saturate(1)",opacity:1}];const anim=clone.animate(keyframes,{duration,easing:"cubic-bezier(.2,.75,.2,1)",fill:"forwards"});return anim.finished.catch(()=>{}).then(()=>clone.remove())};const goIndex=async i=>{if(!desktop.matches||locked)return;const current=nearest();const n=Math.max(0,Math.min(sections.length-1,i));if(n===current)return;locked=true;wheelAccum=0;document.body.classList.add("map-transitioning");const currentMap=mapForSection(current),targetMap=mapForSection(n);const duration=860;const currentBg=currentMap>=0&&chapterBgs[currentMap];const targetBg=targetMap>=0&&chapterBgs[targetMap];if(currentBg&&currentMap!==targetMap)currentBg.style.opacity="0";if(targetBg&&currentMap!==targetMap)targetBg.style.opacity="0";const mapAnims=[];if(currentMap>=0&&currentMap!==targetMap)mapAnims.push(morphMap(currentMap,false,duration,95));if(targetMap>=0&&targetMap!==currentMap)mapAnims.push(morphMap(targetMap,true,duration,96));await Promise.all([scrollTween(targetY(sections[n]),duration),...mapAnims]);window.scrollTo(0,targetY(sections[n]));if(currentBg)currentBg.style.opacity="1";if(targetBg)targetBg.style.opacity="1";document.body.classList.remove("map-transitioning");locked=false;syncDots()};const go=dir=>goIndex(nearest()+dir);dots.forEach(d=>d.addEventListener("click",()=>{const i=sections.findIndex(s=>s.id===d.dataset.target);if(i>=0)goIndex(i)}));window.addEventListener("wheel",e=>{if(!desktop.matches||e.ctrlKey)return;e.preventDefault();if(locked)return;wheelAccum+=e.deltaY;if(Math.abs(wheelAccum)<18)return;go(wheelAccum>0?1:-1)},{passive:false});window.addEventListener("keydown",e=>{if(!desktop.matches||/INPUT|TEXTAREA|SELECT/.test(document.activeElement&&document.activeElement.tagName))return;if(["ArrowDown","PageDown"].includes(e.key)||(e.key===" "&&!e.shiftKey)){e.preventDefault();go(1)}else if(["ArrowUp","PageUp"].includes(e.key)||(e.key===" "&&e.shiftKey)){e.preventDefault();go(-1)}});window.addEventListener("scroll",requestSync,{passive:true});window.addEventListener("resize",()=>{if(desktop.matches&&!locked){const i=nearest();window.scrollTo(0,targetY(sections[i]))}syncDots()});setTimeout(()=>{if(desktop.matches){const i=nearest();window.scrollTo(0,targetY(sections[i]))}syncDots()},100)}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init()})();<'+'/script>';
