<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="200" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Pharmaceutical research lab scene -->
  <!-- Background -->
  <rect width="300" height="200" fill="#f8fafc"/>
  
  <!-- Lab bench -->
  <rect x="20" y="140" width="260" height="40" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1"/>
  <rect x="20" y="175" width="260" height="5" fill="#9ca3af"/>
  
  <!-- Computer workstation -->
  <rect x="60" y="80" width="120" height="75" rx="4" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  <rect x="70" y="90" width="100" height="55" rx="2" fill="#111827"/>
  
  <!-- Molecular modeling interface -->
  <!-- Header -->
  <rect x="75" y="95" width="90" height="8" fill="#1e293b"/>
  <rect x="80" y="97" width="25" height="4" fill="#2563eb" opacity="0.8"/>
  <rect x="110" y="97" width="20" height="4" fill="#6b7280" opacity="0.6"/>
  
  <!-- 3D molecular structure -->
  <circle cx="120" cy="115" r="3" fill="#ef4444"/> <!-- Oxygen -->
  <circle cx="110" cy="125" r="2.5" fill="#6b7280"/> <!-- Carbon -->
  <circle cx="130" cy="125" r="2.5" fill="#6b7280"/> <!-- Carbon -->
  <circle cx="105" cy="135" r="2" fill="#3b82f6"/> <!-- Nitrogen -->
  <circle cx="135" cy="135" r="2" fill="#3b82f6"/> <!-- Nitrogen -->
  
  <!-- Molecular bonds -->
  <path d="M120 112 L110 122" stroke="#e5e7eb" stroke-width="1.5"/>
  <path d="M120 112 L130 122" stroke="#e5e7eb" stroke-width="1.5"/>
  <path d="M110 125 L105 135" stroke="#e5e7eb" stroke-width="1"/>
  <path d="M130 125 L135 135" stroke="#e5e7eb" stroke-width="1"/>
  <path d="M110 125 L130 125" stroke="#e5e7eb" stroke-width="2"/>
  
  <!-- Data panel -->
  <rect x="145" y="110" width="20" height="30" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="148" y="115" width="12" height="2" fill="#10b981" opacity="0.7"/>
  <rect x="148" y="119" width="8" height="2" fill="#f59e0b" opacity="0.7"/>
  <rect x="148" y="123" width="15" height="2" fill="#2563eb" opacity="0.7"/>
  <rect x="148" y="127" width="10" height="2" fill="#ef4444" opacity="0.7"/>
  <rect x="148" y="131" width="14" height="2" fill="#6b7280" opacity="0.5"/>
  
  <!-- Lab equipment -->
  <!-- Microscope -->
  <rect x="200" y="100" width="15" height="40" fill="#4b5563"/>
  <circle cx="207" cy="105" r="6" fill="#6b7280" stroke="#4b5563" stroke-width="1"/>
  <rect x="205" y="115" width="4" height="8" fill="#374151"/>
  <rect x="202" y="125" width="10" height="15" fill="#9ca3af" stroke="#6b7280" stroke-width="1"/>
  
  <!-- Test tubes -->
  <rect x="230" y="120" width="4" height="20" rx="2" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <rect x="230" y="135" width="4" height="5" fill="#3b82f6" opacity="0.6"/>
  
  <rect x="240" y="115" width="4" height="25" rx="2" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <rect x="240" y="130" width="4" height="10" fill="#ef4444" opacity="0.6"/>
  
  <rect x="250" y="125" width="4" height="15" rx="2" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <rect x="250" y="135" width="4" height="5" fill="#10b981" opacity="0.6"/>
  
  <!-- Test tube rack -->
  <rect x="225" y="140" width="35" height="3" fill="#9ca3af"/>
  
  <!-- Documents/printouts -->
  <rect x="25" y="110" width="20" height="25" rx="1" fill="white" stroke="#d1d5db" stroke-width="1"/>
  <rect x="28" y="115" width="12" height="2" fill="#2563eb" opacity="0.6"/>
  <rect x="28" y="119" width="10" height="2" fill="#6b7280" opacity="0.5"/>
  <rect x="28" y="123" width="14" height="2" fill="#6b7280" opacity="0.5"/>
  <rect x="28" y="127" width="8" height="2" fill="#6b7280" opacity="0.5"/>
  
  <!-- Chart on document -->
  <rect x="30" y="160" width="15" height="10" fill="white" stroke="#d1d5db" stroke-width="1"/>
  <path d="M32 167 L36 163 L40 165 L44 161" stroke="#10b981" stroke-width="1" fill="none"/>
  
  <!-- Success metrics -->
  <circle cx="25" cy="50" r="15" fill="white" stroke="#10b981" stroke-width="2"/>
  <path d="M20 50 L23 53 L30 45" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="50" y="50" font-family="Arial, sans-serif" font-size="9" fill="#374151">药物筛选效率</text>
  <text x="50" y="62" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#10b981">提升5倍</text>
  
  <!-- Innovation indicator -->
  <circle cx="260" cy="50" r="8" fill="white" stroke="#f59e0b" stroke-width="2"/>
  <path d="M258 46 L258 54 M254 50 L262 50" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <text x="210" y="55" font-family="Arial, sans-serif" font-size="8" fill="#374151">新药发现周期缩短40%</text>
</svg>