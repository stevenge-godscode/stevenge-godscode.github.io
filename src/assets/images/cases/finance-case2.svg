<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="200" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Asset management platform scene -->
  <!-- Background -->
  <rect width="300" height="200" fill="#f8fafc"/>
  
  <!-- Large display screen -->
  <rect x="30" y="30" width="240" height="140" rx="6" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  <rect x="40" y="40" width="220" height="120" rx="4" fill="#111827"/>
  
  <!-- Multi-panel dashboard -->
  <!-- Top navigation -->
  <rect x="45" y="45" width="210" height="12" fill="#1e293b"/>
  <rect x="50" y="48" width="30" height="6" fill="#2563eb" opacity="0.8"/>
  <rect x="85" y="48" width="25" height="6" fill="#6b7280" opacity="0.6"/>
  <rect x="115" y="48" width="28" height="6" fill="#6b7280" opacity="0.6"/>
  
  <!-- Left panel - Portfolio overview -->
  <rect x="50" y="65" width="80" height="85" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  
  <!-- Pie chart -->
  <circle cx="90" cy="95" r="15" fill="none" stroke="#334155" stroke-width="1"/>
  <path d="M90 80 A15 15 0 0 1 100 105 L90 95 Z" fill="#2563eb" opacity="0.8"/>
  <path d="M100 105 A15 15 0 0 1 80 105 L90 95 Z" fill="#10b981" opacity="0.8"/>
  <path d="M80 105 A15 15 0 0 1 90 80 L90 95 Z" fill="#f59e0b" opacity="0.8"/>
  
  <!-- Portfolio metrics -->
  <rect x="55" y="115" width="25" height="3" fill="#2563eb" opacity="0.6"/>
  <rect x="82" y="115" width="15" height="3" fill="#e5e7eb" opacity="0.6"/>
  <rect x="55" y="120" width="30" height="3" fill="#10b981" opacity="0.6"/>
  <rect x="87" y="120" width="12" height="3" fill="#e5e7eb" opacity="0.6"/>
  <rect x="55" y="125" width="22" height="3" fill="#f59e0b" opacity="0.6"/>
  <rect x="79" y="125" width="18" height="3" fill="#e5e7eb" opacity="0.6"/>
  
  <!-- Right panel - Risk analysis -->
  <rect x="140" y="65" width="110" height="85" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  
  <!-- Risk matrix -->
  <rect x="145" y="70" width="50" height="40" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="200" y="70" width="45" height="40" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  
  <!-- Heat map blocks -->
  <rect x="150" y="75" width="8" height="8" fill="#10b981" opacity="0.3"/>
  <rect x="160" y="75" width="8" height="8" fill="#10b981" opacity="0.5"/>
  <rect x="170" y="75" width="8" height="8" fill="#f59e0b" opacity="0.4"/>
  <rect x="180" y="75" width="8" height="8" fill="#ef4444" opacity="0.6"/>
  
  <rect x="150" y="85" width="8" height="8" fill="#10b981" opacity="0.5"/>
  <rect x="160" y="85" width="8" height="8" fill="#f59e0b" opacity="0.3"/>
  <rect x="170" y="85" width="8" height="8" fill="#f59e0b" opacity="0.6"/>
  <rect x="180" y="85" width="8" height="8" fill="#ef4444" opacity="0.8"/>
  
  <!-- Alert indicators -->
  <circle cx="210" cy="80" r="4" fill="#ef4444" opacity="0.8"/>
  <circle cx="210" cy="90" r="4" fill="#f59e0b" opacity="0.8"/>
  <circle cx="210" cy="100" r="4" fill="#10b981" opacity="0.8"/>
  
  <!-- Performance charts -->
  <rect x="145" y="120" width="100" height="25" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <path d="M150 137 L160 130 L170 132 L180 125 L190 128 L200 120 L210 122 L220 115 L230 118 L240 112" 
        stroke="#10b981" stroke-width="2" fill="none"/>
  <path d="M150 140 L160 135 L170 138 L180 133 L190 136 L200 130 L210 132 L220 125 L230 128 L240 122" 
        stroke="#2563eb" stroke-width="1.5" fill="none" opacity="0.7"/>
  
  <!-- Status bar -->
  <rect x="45" y="148" width="210" height="8" fill="#1e293b"/>
  <circle cx="52" cy="152" r="2" fill="#10b981"/>
  <rect x="58" y="150" width="40" height="4" fill="#e5e7eb" opacity="0.6"/>
  <circle cx="105" cy="152" r="2" fill="#f59e0b"/>
  <rect x="111" y="150" width="35" height="4" fill="#e5e7eb" opacity="0.6"/>
  
  <!-- Desktop items -->
  <!-- Notebook -->
  <rect x="280" y="120" width="15" height="20" rx="1" fill="white" stroke="#d1d5db" stroke-width="1"/>
  <rect x="282" y="125" width="8" height="1" fill="#2563eb" opacity="0.6"/>
  <rect x="282" y="128" width="6" height="1" fill="#6b7280" opacity="0.6"/>
  <rect x="282" y="131" width="9" height="1" fill="#6b7280" opacity="0.6"/>
  
  <!-- Pen -->
  <rect x="276" y="145" width="1" height="12" fill="#1f2937" transform="rotate(15 276 145)"/>
  <rect x="274" y="143" width="3" height="3" fill="#2563eb" transform="rotate(15 276 145)"/>
  
  <!-- Results indicator -->
  <circle cx="20" cy="180" r="12" fill="white" stroke="#2563eb" stroke-width="2"/>
  <text x="20" y="185" font-family="Arial, sans-serif" font-size="8" fill="#2563eb" text-anchor="middle">150%</text>
  <text x="50" y="185" font-family="Arial, sans-serif" font-size="7" fill="#374151">资管规模增长</text>
</svg>