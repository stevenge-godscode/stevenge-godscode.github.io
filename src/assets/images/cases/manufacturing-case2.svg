<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="200" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Quality control inspection scene -->
  <!-- Background -->
  <rect width="300" height="200" fill="#f8fafc"/>
  
  <!-- Inspection table -->
  <rect x="50" y="120" width="200" height="30" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1"/>
  <rect x="50" y="145" width="200" height="5" fill="#9ca3af"/>
  
  <!-- High-resolution inspection camera system -->
  <rect x="120" y="40" width="60" height="40" rx="4" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  <rect x="130" y="50" width="40" height="20" rx="2" fill="#111827"/>
  
  <!-- Camera lens -->
  <circle cx="150" cy="60" r="12" fill="#374151" stroke="#4b5563" stroke-width="2"/>
  <circle cx="150" cy="60" r="8" fill="#1f2937"/>
  <circle cx="150" cy="60" r="4" fill="#3b82f6" opacity="0.8"/>
  <circle cx="150" cy="60" r="1" fill="#93c5fd"/>
  
  <!-- Camera mounting arm -->
  <rect x="148" y="80" width="4" height="20" fill="#6b7280"/>
  <rect x="145" y="100" width="10" height="5" fill="#9ca3af"/>
  
  <!-- Product being inspected -->
  <rect x="130" y="115" width="40" height="8" rx="2" fill="#3b82f6" stroke="#2563eb" stroke-width="1"/>
  <!-- Circuit board pattern -->
  <rect x="135" y="117" width="8" height="1" fill="#10b981" opacity="0.8"/>
  <rect x="145" y="118" width="6" height="1" fill="#f59e0b" opacity="0.8"/>
  <rect x="155" y="117" width="10" height="1" fill="#10b981" opacity="0.8"/>
  <circle cx="138" cy="120" r="1" fill="#ef4444"/>
  <circle cx="148" cy="121" r="1" fill="#10b981"/>
  <circle cx="158" cy="120" r="1" fill="#3b82f6"/>
  <circle cx="162" cy="119" r="1" fill="#f59e0b"/>
  
  <!-- Inspection beam/light -->
  <path d="M150 72 L150 115" stroke="#3b82f6" stroke-width="4" opacity="0.3"/>
  <rect x="125" y="110" width="50" height="15" fill="#3b82f6" opacity="0.1"/>
  
  <!-- AI analysis display -->
  <rect x="200" y="60" width="80" height="50" rx="3" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  <rect x="205" y="65" width="70" height="40" rx="2" fill="#111827"/>
  
  <!-- Analysis results -->
  <rect x="210" y="70" width="60" height="25" fill="#1e293b"/>
  <!-- Defect detection visualization -->
  <rect x="215" y="75" width="20" height="15" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <!-- Magnified view of product -->
  <rect x="216" y="76" width="6" height="2" fill="#10b981" opacity="0.8"/>
  <rect x="224" y="77" width="4" height="2" fill="#f59e0b" opacity="0.8"/>
  <rect x="230" y="76" width="3" height="2" fill="#10b981" opacity="0.8"/>
  <circle cx="218" cy="82" r="1" fill="#ef4444"/> <!-- Detected defect -->
  <circle cx="218" cy="82" r="3" fill="none" stroke="#ef4444" stroke-width="1"/> <!-- Highlight -->
  <circle cx="227" cy="83" r="1" fill="#10b981"/>
  <circle cx="232" cy="82" r="1" fill="#3b82f6"/>
  
  <!-- Analysis metrics -->
  <rect x="240" y="75" width="25" height="15" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="242" y="78" width="15" height="2" fill="#10b981" opacity="0.8"/>
  <text x="242" y="85" font-family="Arial, sans-serif" font-size="6" fill="#10b981">99.9%</text>
  <rect x="242" y="87" width="12" height="2" fill="#6b7280" opacity="0.6"/>
  
  <!-- Real-time quality dashboard -->
  <rect x="20" y="60" width="70" height="40" rx="3" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  <rect x="25" y="65" width="60" height="30" rx="2" fill="#111827"/>
  
  <!-- Quality metrics -->
  <rect x="30" y="70" width="50" height="20" fill="#1e293b"/>
  <!-- Pass/Fail statistics -->
  <rect x="33" y="73" width="20" height="3" fill="#10b981" opacity="0.8"/>
  <text x="33" y="80" font-family="Arial, sans-serif" font-size="6" fill="#10b981">通过: 99.2%</text>
  <rect x="33" y="82" width="5" height="3" fill="#ef4444" opacity="0.8"/>
  <text x="33" y="89" font-family="Arial, sans-serif" font-size="6" fill="#ef4444">不良: 0.8%</text>
  
  <!-- Production rate -->
  <rect x="55" y="73" width="20" height="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <path d="M58 83 L62 79 L66 81 L70 77" stroke="#2563eb" stroke-width="1" fill="none"/>
  <text x="62" y="89" font-family="Arial, sans-serif" font-size="5" fill="#2563eb" text-anchor="middle">产能</text>
  
  <!-- Additional products on conveyor -->
  <rect x="80" y="115" width="20" height="8" rx="2" fill="#10b981" stroke="#059669" stroke-width="1"/>
  <rect x="190" y="115" width="20" height="8" rx="2" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
  <rect x="220" y="115" width="20" height="8" rx="2" fill="#ef4444" stroke="#dc2626" stroke-width="1"/>
  
  <!-- Quality status indicators for each product -->
  <circle cx="90" cy="110" r="3" fill="#10b981"/> <!-- Pass -->
  <path d="M88 110 L90 112 L93 108" stroke="white" stroke-width="1" fill="none"/>
  
  <circle cx="200" cy="110" r="3" fill="#f59e0b"/> <!-- Warning -->
  <text x="200" y="112" font-family="Arial, sans-serif" font-size="6" fill="white" text-anchor="middle">!</text>
  
  <circle cx="230" cy="110" r="3" fill="#ef4444"/> <!-- Fail -->
  <path d="M228 108 L232 112 M228 112 L232 108" stroke="white" stroke-width="1"/>
  
  <!-- Robotic sorting arm -->
  <rect x="260" y="80" width="4" height="35" fill="#4b5563"/>
  <rect x="258" y="85" width="8" height="3" fill="#6b7280"/>
  <circle cx="262" cy="80" r="3" fill="#9ca3af" stroke="#6b7280" stroke-width="1"/>
  <rect x="259" y="75" width="6" height="8" rx="1" fill="#374151"/>
  <!-- Gripper holding rejected product -->
  <rect x="258" y="70" width="8" height="8" rx="1" fill="#ef4444" stroke="#dc2626" stroke-width="1"/>
  
  <!-- Reject bin -->
  <rect x="270" y="120" width="20" height="25" rx="2" fill="#6b7280" stroke="#4b5563" stroke-width="1"/>
  <rect x="275" y="140" width="10" height="2" fill="#ef4444" opacity="0.6"/>
  
  <!-- Inspection results summary -->
  <rect x="10" y="160" width="100" height="30" fill="white" stroke="#d1d5db" stroke-width="1"/>
  <text x="60" y="170" font-family="Arial, sans-serif" font-size="8" fill="#374151" text-anchor="middle">检测准确率: 99.9%</text>
  <text x="60" y="180" font-family="Arial, sans-serif" font-size="8" fill="#374151" text-anchor="middle">不良品率降低80%</text>
  
  <!-- Performance indicator -->
  <circle cx="240" cy="30" r="20" fill="white" stroke="#10b981" stroke-width="3"/>
  <text x="240" y="25" font-family="Arial, sans-serif" font-size="10" fill="#10b981" text-anchor="middle">80%</text>
  <text x="240" y="38" font-family="Arial, sans-serif" font-size="6" fill="#374151" text-anchor="middle">缺陷降低</text>
  
  <!-- AI processing unit -->
  <rect x="30" y="20" width="40" height="25" rx="3" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  <rect x="35" y="25" width="30" height="15" rx="2" fill="#111827"/>
  <circle cx="50" cy="32" r="5" fill="#2563eb" opacity="0.8"/>
  <circle cx="50" cy="32" r="2" fill="#93c5fd"/>
  <text x="50" y="50" font-family="Arial, sans-serif" font-size="7" fill="#374151" text-anchor="middle">AI视觉检测</text>
  
  <!-- Data flow indicators -->
  <path d="M70 32 L120 60" stroke="#2563eb" stroke-width="1.5" opacity="0.5" stroke-dasharray="3,3"/>
  <path d="M170 60 L200 70" stroke="#10b981" stroke-width="1.5" opacity="0.5" stroke-dasharray="3,3"/>
  <path d="M200 85 L260 95" stroke="#ef4444" stroke-width="1.5" opacity="0.5" stroke-dasharray="3,3"/>
</svg>