<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="200" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Clinical research collaboration scene -->
  <!-- Background -->
  <rect width="300" height="200" fill="#f8fafc"/>
  
  <!-- Conference room table -->
  <ellipse cx="150" cy="120" rx="80" ry="40" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  
  <!-- Multiple laptops/tablets around table -->
  <!-- Laptop 1 -->
  <rect x="80" y="90" width="40" height="25" rx="2" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <rect x="85" y="95" width="30" height="15" rx="1" fill="#111827"/>
  <!-- Screen content -->
  <rect x="88" y="98" width="24" height="9" fill="#1e293b"/>
  <rect x="90" y="100" width="8" height="1" fill="#2563eb" opacity="0.8"/>
  <rect x="90" y="102" width="12" height="1" fill="#10b981" opacity="0.6"/>
  <rect x="90" y="104" width="6" height="1" fill="#f59e0b" opacity="0.6"/>
  
  <!-- Laptop 2 -->
  <rect x="180" y="85" width="40" height="25" rx="2" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <rect x="185" y="90" width="30" height="15" rx="1" fill="#111827"/>
  <!-- Screen content -->
  <rect x="188" y="93" width="24" height="9" fill="#1e293b"/>
  <path d="M190 98 L195 95 L200 97 L205 93 L210 95" stroke="#10b981" stroke-width="1" fill="none"/>
  <rect x="190" y="100" width="18" height="1" fill="#6b7280" opacity="0.5"/>
  
  <!-- Tablet 1 -->
  <rect x="70" y="130" width="25" height="18" rx="2" fill="#374151" stroke="#4b5563" stroke-width="1"/>
  <rect x="73" y="133" width="19" height="12" rx="1" fill="#111827"/>
  <!-- Patient data visualization -->
  <rect x="75" y="135" width="15" height="8" fill="#1e293b"/>
  <circle cx="78" cy="138" r="1.5" fill="#ef4444" opacity="0.8"/>
  <circle cx="82" cy="140" r="1.5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="87" cy="139" r="1.5" fill="#10b981" opacity="0.8"/>
  
  <!-- Tablet 2 -->
  <rect x="205" y="135" width="25" height="18" rx="2" fill="#374151" stroke="#4b5563" stroke-width="1"/>
  <rect x="208" y="138" width="19" height="12" rx="1" fill="#111827"/>
  <!-- Clinical trial progress -->
  <rect x="210" y="140" width="15" height="8" fill="#1e293b"/>
  <rect x="211" y="142" width="4" height="1" fill="#2563eb" opacity="0.8"/>
  <rect x="211" y="144" width="8" height="1" fill="#10b981" opacity="0.8"/>
  <rect x="211" y="146" width="6" height="1" fill="#f59e0b" opacity="0.6"/>
  
  <!-- Central display/projector screen -->
  <rect x="120" y="30" width="60" height="40" rx="3" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  <rect x="125" y="35" width="50" height="30" rx="2" fill="#111827"/>
  
  <!-- Multi-center collaboration dashboard -->
  <rect x="130" y="40" width="40" height="20" fill="#1e293b"/>
  <!-- World map outline -->
  <rect x="135" y="45" width="8" height="6" fill="#2563eb" opacity="0.3"/>
  <rect x="145" y="43" width="10" height="8" fill="#10b981" opacity="0.3"/>
  <rect x="157" y="47" width="6" height="5" fill="#f59e0b" opacity="0.3"/>
  
  <!-- Connection lines between centers -->
  <path d="M139 48 L149 47" stroke="#2563eb" stroke-width="1" opacity="0.6"/>
  <path d="M149 47 L160 50" stroke="#10b981" stroke-width="1" opacity="0.6"/>
  
  <!-- Status indicators -->
  <circle cx="139" cy="48" r="1" fill="#10b981"/>
  <circle cx="149" cy="47" r="1" fill="#10b981"/>
  <circle cx="160" cy="50" r="1" fill="#f59e0b"/>
  
  <!-- Papers and documents -->
  <rect x="40" y="100" width="15" height="20" rx="1" fill="white" stroke="#d1d5db" stroke-width="1"/>
  <rect x="42" y="105" width="10" height="1" fill="#2563eb" opacity="0.6"/>
  <rect x="42" y="108" width="8" height="1" fill="#6b7280" opacity="0.5"/>
  <rect x="42" y="111" width="11" height="1" fill="#6b7280" opacity="0.5"/>
  <rect x="42" y="114" width="6" height="1" fill="#6b7280" opacity="0.5"/>
  
  <rect x="245" y="95" width="15" height="20" rx="1" fill="white" stroke="#d1d5db" stroke-width="1"/>
  <rect x="247" y="100" width="10" height="1" fill="#ef4444" opacity="0.6"/>
  <rect x="247" y="103" width="8" height="1" fill="#6b7280" opacity="0.5"/>
  <rect x="247" y="106" width="11" height="1" fill="#6b7280" opacity="0.5"/>
  
  <!-- Coffee cups -->
  <ellipse cx="110" cy="75" rx="5" ry="3" fill="white" stroke="#d1d5db" stroke-width="1"/>
  <ellipse cx="110" cy="74" rx="4" ry="2" fill="#6b4423"/>
  
  <ellipse cx="190" cy="155" rx="5" ry="3" fill="white" stroke="#d1d5db" stroke-width="1"/>
  <ellipse cx="190" cy="154" rx="4" ry="2" fill="#6b4423"/>
  
  <!-- Collaboration efficiency indicator -->
  <circle cx="30" cy="30" r="18" fill="white" stroke="#10b981" stroke-width="2"/>
  <text x="30" y="25" font-family="Arial, sans-serif" font-size="8" fill="#10b981" text-anchor="middle">200%</text>
  <text x="30" y="38" font-family="Arial, sans-serif" font-size="6" fill="#374151" text-anchor="middle">协作效率</text>
  
  <!-- Data processing speed indicator -->
  <rect x="250" y="20" width="40" height="25" rx="3" fill="white" stroke="#2563eb" stroke-width="2"/>
  <rect x="255" y="28" width="30" height="2" fill="#2563eb" opacity="0.8"/>
  <rect x="255" y="32" width="20" height="2" fill="#2563eb" opacity="0.6"/>
  <rect x="255" y="36" width="25" height="2" fill="#2563eb" opacity="0.4"/>
  <text x="270" y="50" font-family="Arial, sans-serif" font-size="7" fill="#374151" text-anchor="middle">数据处理提速70%</text>
  
  <!-- Network connection lines -->
  <path d="M100 105 L130 60" stroke="#e5e7eb" stroke-width="1" opacity="0.4" stroke-dasharray="2,2"/>
  <path d="M200 100 L160 60" stroke="#e5e7eb" stroke-width="1" opacity="0.4" stroke-dasharray="2,2"/>
  <path d="M95 140 L140 65" stroke="#e5e7eb" stroke-width="1" opacity="0.4" stroke-dasharray="2,2"/>
  <path d="M218 145 L165 65" stroke="#e5e7eb" stroke-width="1" opacity="0.4" stroke-dasharray="2,2"/>
</svg>