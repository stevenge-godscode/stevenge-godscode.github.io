<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="200" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="knowledgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#00c6fb;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="knowledgeIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00c6fb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="url(#knowledgeBg)"/>
  
  <!-- Central knowledge hub -->
  <circle cx="150" cy="100" r="30" fill="white" stroke="url(#knowledgeIcon)" stroke-width="3"/>
  <circle cx="150" cy="100" r="15" fill="url(#knowledgeIcon)" opacity="0.8"/>
  
  <!-- Knowledge categories -->
  <rect x="60" y="40" width="40" height="30" rx="4" fill="white" stroke="url(#knowledgeIcon)" stroke-width="2"/>
  <rect x="200" y="40" width="40" height="30" rx="4" fill="white" stroke="url(#knowledgeIcon)" stroke-width="2"/>
  <rect x="60" y="130" width="40" height="30" rx="4" fill="white" stroke="url(#knowledgeIcon)" stroke-width="2"/>
  <rect x="200" y="130" width="40" height="30" rx="4" fill="white" stroke="url(#knowledgeIcon)" stroke-width="2"/>
  
  <!-- Document icons in categories -->
  <rect x="70" y="48" width="20" height="2" fill="url(#knowledgeIcon)" opacity="0.6"/>
  <rect x="70" y="53" width="15" height="2" fill="url(#knowledgeIcon)" opacity="0.6"/>
  <rect x="70" y="58" width="18" height="2" fill="url(#knowledgeIcon)" opacity="0.6"/>
  
  <rect x="210" y="48" width="20" height="2" fill="url(#knowledgeIcon)" opacity="0.6"/>
  <rect x="210" y="53" width="15" height="2" fill="url(#knowledgeIcon)" opacity="0.6"/>
  <rect x="210" y="58" width="18" height="2" fill="url(#knowledgeIcon)" opacity="0.6"/>
  
  <rect x="70" y="138" width="20" height="2" fill="url(#knowledgeIcon)" opacity="0.6"/>
  <rect x="70" y="143" width="15" height="2" fill="url(#knowledgeIcon)" opacity="0.6"/>
  <rect x="70" y="148" width="18" height="2" fill="url(#knowledgeIcon)" opacity="0.6"/>
  
  <rect x="210" y="138" width="20" height="2" fill="url(#knowledgeIcon)" opacity="0.6"/>
  <rect x="210" y="143" width="15" height="2" fill="url(#knowledgeIcon)" opacity="0.6"/>
  <rect x="210" y="148" width="18" height="2" fill="url(#knowledgeIcon)" opacity="0.6"/>
  
  <!-- Connection lines from categories to center -->
  <path d="M100 55 L120 85" stroke="url(#knowledgeIcon)" stroke-width="2" opacity="0.6"/>
  <path d="M200 55 L180 85" stroke="url(#knowledgeIcon)" stroke-width="2" opacity="0.6"/>
  <path d="M100 145 L120 115" stroke="url(#knowledgeIcon)" stroke-width="2" opacity="0.6"/>
  <path d="M200 145 L180 115" stroke="url(#knowledgeIcon)" stroke-width="2" opacity="0.6"/>
  
  <!-- Search/query element -->
  <rect x="20" y="85" width="50" height="30" rx="15" fill="white" stroke="url(#knowledgeIcon)" stroke-width="2"/>
  <circle cx="30" cy="95" r="4" fill="none" stroke="url(#knowledgeIcon)" stroke-width="1.5"/>
  <path d="M33 98 L36 101" stroke="url(#knowledgeIcon)" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="42" y="98" width="20" height="2" fill="url(#knowledgeIcon)" opacity="0.6"/>
  <rect x="42" y="102" width="15" height="2" fill="url(#knowledgeIcon)" opacity="0.6"/>
  
  <!-- Response element -->
  <rect x="230" y="85" width="50" height="30" rx="15" fill="white" stroke="url(#knowledgeIcon)" stroke-width="2"/>
  <circle cx="245" cy="95" r="3" fill="url(#knowledgeIcon)"/>
  <circle cx="252" cy="95" r="3" fill="url(#knowledgeIcon)"/>
  <circle cx="259" cy="95" r="3" fill="url(#knowledgeIcon)"/>
  <rect x="240" y="102" width="20" height="2" fill="url(#knowledgeIcon)" opacity="0.6"/>
  <rect x="240" y="106" width="25" height="2" fill="url(#knowledgeIcon)" opacity="0.6"/>
  
  <!-- Query and response connections -->
  <path d="M70 100 L120 100" stroke="url(#knowledgeIcon)" stroke-width="2" opacity="0.6"/>
  <path d="M180 100 L230 100" stroke="url(#knowledgeIcon)" stroke-width="2" opacity="0.6"/>
</svg>