<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Financial research dashboard scene -->
  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc"/>
  
  <!-- Main dashboard container -->
  <rect x="40" y="60" width="320" height="180" rx="8" fill="white" stroke="#e5e7eb" stroke-width="2"/>
  
  <!-- Dashboard header -->
  <rect x="50" y="70" width="300" height="30" fill="#1f2937"/>
  <text x="60" y="88" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="600">智能研究分析平台</text>
  <circle cx="330" cy="85" r="4" fill="#10b981"/>
  <text x="340" y="88" font-family="Arial, sans-serif" font-size="10" fill="#10b981">实时</text>
  
  <!-- Left panel - Data sources -->
  <rect x="60" y="110" width="90" height="120" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="65" y="115" width="80" height="20" fill="#2563eb" opacity="0.1"/>
  <text x="105" y="127" font-family="Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle" font-weight="600">数据源</text>
  
  <!-- Data source items -->
  <rect x="70" y="140" width="70" height="12" fill="white" stroke="#d1d5db" stroke-width="1"/>
  <rect x="72" y="142" width="8" height="8" fill="#3b82f6"/>
  <text x="85" y="149" font-family="Arial, sans-serif" font-size="8" fill="#374151">研报数据</text>
  
  <rect x="70" y="155" width="70" height="12" fill="white" stroke="#d1d5db" stroke-width="1"/>
  <rect x="72" y="157" width="8" height="8" fill="#10b981"/>
  <text x="85" y="164" font-family="Arial, sans-serif" font-size="8" fill="#374151">市场数据</text>
  
  <rect x="70" y="170" width="70" height="12" fill="white" stroke="#d1d5db" stroke-width="1"/>
  <rect x="72" y="172" width="8" height="8" fill="#f59e0b"/>
  <text x="85" y="179" font-family="Arial, sans-serif" font-size="8" fill="#374151">财务数据</text>
  
  <rect x="70" y="185" width="70" height="12" fill="white" stroke="#d1d5db" stroke-width="1"/>
  <rect x="72" y="187" width="8" height="8" fill="#ef4444"/>
  <text x="85" y="194" font-family="Arial, sans-serif" font-size="8" fill="#374151">新闻资讯</text>
  
  <!-- Center panel - Knowledge graph visualization -->
  <rect x="160" y="110" width="120" height="120" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="165" y="115" width="110" height="20" fill="#10b981" opacity="0.1"/>
  <text x="220" y="127" font-family="Arial, sans-serif" font-size="10" fill="#10b981" text-anchor="middle" font-weight="600">知识图谱</text>
  
  <!-- Knowledge graph nodes -->
  <circle cx="200" cy="160" r="12" fill="#3b82f6" opacity="0.8"/>
  <text x="200" y="164" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">股票</text>
  
  <circle cx="240" cy="140" r="10" fill="#10b981" opacity="0.8"/>
  <text x="240" y="144" font-family="Arial, sans-serif" font-size="7" fill="white" text-anchor="middle">行业</text>
  
  <circle cx="180" cy="190" r="10" fill="#f59e0b" opacity="0.8"/>
  <text x="180" y="194" font-family="Arial, sans-serif" font-size="7" fill="white" text-anchor="middle">财务</text>
  
  <circle cx="250" cy="180" r="8" fill="#ef4444" opacity="0.8"/>
  <text x="250" y="183" font-family="Arial, sans-serif" font-size="6" fill="white" text-anchor="middle">风险</text>
  
  <circle cx="220" cy="200" r="8" fill="#8b5cf6" opacity="0.8"/>
  <text x="220" y="203" font-family="Arial, sans-serif" font-size="6" fill="white" text-anchor="middle">新闻</text>
  
  <!-- Knowledge graph connections -->
  <path d="M200 148 L240 150" stroke="#6b7280" stroke-width="2" opacity="0.6"/>
  <path d="M200 172 L180 180" stroke="#6b7280" stroke-width="2" opacity="0.6"/>
  <path d="M200 172 L220 192" stroke="#6b7280" stroke-width="2" opacity="0.6"/>
  <path d="M240 150 L250 172" stroke="#6b7280" stroke-width="1.5" opacity="0.6"/>
  <path d="M250 172 L220 192" stroke="#6b7280" stroke-width="1" opacity="0.6"/>
  
  <!-- Right panel - Analysis results -->
  <rect x="290" y="110" width="60" height="120" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="295" y="115" width="50" height="20" fill="#f59e0b" opacity="0.1"/>
  <text x="320" y="127" font-family="Arial, sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="600">分析结果</text>
  
  <!-- Analysis charts -->
  <rect x="300" y="140" width="40" height="25" fill="white" stroke="#d1d5db" stroke-width="1"/>
  <path d="M305 155 L310 150 L315 152 L320 148 L325 150 L330 145 L335 147" 
        stroke="#10b981" stroke-width="2" fill="none"/>
  <text x="317" y="175" font-family="Arial, sans-serif" font-size="7" fill="#374151" text-anchor="middle">趋势分析</text>
  
  <rect x="300" y="180" width="40" height="25" fill="white" stroke="#d1d5db" stroke-width="1"/>
  <rect x="305" y="185" width="6" height="15" fill="#3b82f6" opacity="0.8"/>
  <rect x="313" y="190" width="6" height="10" fill="#10b981" opacity="0.8"/>
  <rect x="321" y="188" width="6" height="12" fill="#f59e0b" opacity="0.8"/>
  <rect x="329" y="185" width="6" height="15" fill="#ef4444" opacity="0.8"/>
  <text x="317" y="215" font-family="Arial, sans-serif" font-size="7" fill="#374151" text-anchor="middle">评级分布</text>
  
  <!-- AI insights panel -->
  <rect x="60" y="245" width="280" height="30" fill="white" stroke="#2563eb" stroke-width="2"/>
  <rect x="65" y="250" width="25" height="20" fill="#2563eb" opacity="0.1"/>
  <circle cx="77" cy="260" r="6" fill="#2563eb"/>
  <path d="M74 260 L77 263 L82 257" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <text x="95" y="258" font-family="Arial, sans-serif" font-size="9" fill="#2563eb" font-weight="600">AI智能洞察</text>
  <text x="95" y="268" font-family="Arial, sans-serif" font-size="8" fill="#374151">基于多维数据分析，预测该股票未来3个月上涨概率65%</text>
  
  <!-- Performance metrics -->
  <rect x="60" y="20" width="280" height="30" fill="white" stroke="#10b981" stroke-width="2"/>
  <text x="70" y="35" font-family="Arial, sans-serif" font-size="12" fill="#10b981" font-weight="600">效率提升指标</text>
  <text x="70" y="45" font-family="Arial, sans-serif" font-size="10" fill="#374151">研报生成速度提升300% • 知识检索效率提升5倍 • 分析准确率95%+</text>
</svg>