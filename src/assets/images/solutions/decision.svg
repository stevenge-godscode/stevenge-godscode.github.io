  <rect x="230" y="60" width="20" height="2" fill="url(#decisionIcon)" opacity="0.7"/>
  
  <rect x="230" y="93" width="30" height="2" fill="url(#decisionIcon)" opacity="0.7"/>
  <rect x="230" y="97" width="25" height="2" fill="url(#decisionIcon)" opacity="0.7"/>
  <rect x="230" y="101" width="35" height="2" fill="url(#decisionIcon)" opacity="0.7"/>
  <rect x="230" y="105" width="20" height="2" fill="url(#decisionIcon)" opacity="0.7"/>
  
