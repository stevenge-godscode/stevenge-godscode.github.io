  <path d="M44 60 L48 56 L52 58 L56 54" stroke="url(#decisionIcon)" stroke-width="1" fill="none"/>
  
  <rect x="44" y="96" width="12" height="8" fill="url(#decisionIcon)" opacity="0.6"/>
