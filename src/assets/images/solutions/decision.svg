  <circle cx="50" cy="100" r="15" fill="white" stroke="#2563eb" stroke-width="2"/>
  <circle cx="50" cy="130" r="15" fill="white" stroke="#2563eb" stroke-width="2"/>
  
  <!-- Simple data indicators -->
