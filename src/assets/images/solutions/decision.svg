  <rect x="210" y="60" width="60" height="25" rx="4" fill="white" stroke="#2563eb" stroke-width="2"/>
  <rect x="210" y="90" width="60" height="25" rx="4" fill="white" stroke="#2563eb" stroke-width="2"/>
