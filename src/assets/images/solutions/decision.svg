  <rect x="220" y="85" width="60" height="30" rx="6" fill="white" stroke="url(#decisionIcon)" stroke-width="2"/>
  <rect x="220" y="130" width="60" height="30" rx="6" fill="white" stroke="url(#decisionIcon)" stroke-width="2"/>
  
