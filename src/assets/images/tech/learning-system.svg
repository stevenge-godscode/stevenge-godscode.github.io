<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Multi-modal knowledge processing system -->
  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="200" y="25" font-family="Arial, sans-serif" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="600">多模态知识处理系统</text>
  
  <!-- Input Layer -->
  <rect x="50" y="50" width="300" height="50" rx="8" fill="white" stroke="#e5e7eb" stroke-width="2"/>
  <rect x="60" y="60" width="280" height="15" fill="#f3f4f6"/>
  <text x="200" y="70" font-family="Arial, sans-serif" font-size="12" fill="#374151" text-anchor="middle" font-weight="600">多模态数据输入层</text>
  
  <!-- Input modalities -->
  <rect x="70" y="80" width="50" height="15" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="95" y="89" font-family="Arial, sans-serif" font-size="8" fill="#3b82f6" text-anchor="middle">文本</text>
  
  <rect x="130" y="80" width="50" height="15" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="155" y="89" font-family="Arial, sans-serif" font-size="8" fill="#16a34a" text-anchor="middle">图像</text>
  
  <rect x="190" y="80" width="50" height="15" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="215" y="89" font-family="Arial, sans-serif" font-size="8" fill="#d97706" text-anchor="middle">表格</text>
  
  <rect x="250" y="80" width="50" height="15" fill="#fce7f3" stroke="#be185d" stroke-width="1"/>
  <text x="275" y="89" font-family="Arial, sans-serif" font-size="8" fill="#be185d" text-anchor="middle">音频</text>
  
  <rect x="310" y="80" width="30" height="15" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="325" y="89" font-family="Arial, sans-serif" font-size="8" fill="#7c3aed" text-anchor="middle">视频</text>
  
  <!-- Processing Layer -->
  <rect x="50" y="120" width="300" height="80" rx="8" fill="white" stroke="#e5e7eb" stroke-width="2"/>
  <rect x="60" y="130" width="280" height="15" fill="#f3f4f6"/>
  <text x="200" y="140" font-family="Arial, sans-serif" font-size="12" fill="#374151" text-anchor="middle" font-weight="600">知识处理与融合层</text>
  
  <!-- Text processing -->
  <rect x="70" y="155" width="80" height="40" fill="#f8fafc" stroke="#3b82f6" stroke-width="2"/>
  <text x="110" y="170" font-family="Arial, sans-serif" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="600">文本理解</text>
  <text x="110" y="182" font-family="Arial, sans-serif" font-size="7" fill="#374151" text-anchor="middle">• NLP解析</text>
  <text x="110" y="190" font-family="Arial, sans-serif" font-size="7" fill="#374151" text-anchor="middle">• 语义提取</text>
  
  <!-- Image processing -->
  <rect x="160" y="155" width="80" height="40" fill="#f8fafc" stroke="#16a34a" stroke-width="2"/>
  <text x="200" y="170" font-family="Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="600">视觉理解</text>
  <text x="200" y="182" font-family="Arial, sans-serif" font-size="7" fill="#374151" text-anchor="middle">• 目标检测</text>
  <text x="200" y="190" font-family="Arial, sans-serif" font-size="7" fill="#374151" text-anchor="middle">• 场景理解</text>
  
  <!-- Structured data processing -->
  <rect x="250" y="155" width="80" height="40" fill="#f8fafc" stroke="#d97706" stroke-width="2"/>
  <text x="290" y="170" font-family="Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle" font-weight="600">结构化解析</text>
  <text x="290" y="182" font-family="Arial, sans-serif" font-size="7" fill="#374151" text-anchor="middle">• 表格解析</text>
  <text x="290" y="190" font-family="Arial, sans-serif" font-size="7" fill="#374151" text-anchor="middle">• 关系提取</text>
  
  <!-- Fusion Layer -->
  <rect x="50" y="220" width="300" height="50" rx="8" fill="white" stroke="#e5e7eb" stroke-width="2"/>
  <rect x="60" y="230" width="280" height="15" fill="#f3f4f6"/>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="12" fill="#374151" text-anchor="middle" font-weight="600">统一知识表示层</text>
  
  <!-- Unified representation -->
  <rect x="125" y="250" width="150" height="15" fill="#e0f2fe" stroke="#0891b2" stroke-width="2"/>
  <text x="200" y="260" font-family="Arial, sans-serif" font-size="10" fill="#0891b2" text-anchor="middle" font-weight="600">统一知识图谱</text>
  
  <!-- Data flow arrows -->
  <!-- From inputs to processing -->
  <path d="M95 95 L110 155" stroke="#3b82f6" stroke-width="1.5" opacity="0.7"/>
  <path d="M155 95 L200 155" stroke="#16a34a" stroke-width="1.5" opacity="0.7"/>
  <path d="M215 95 L290 155" stroke="#d97706" stroke-width="1.5" opacity="0.7"/>
  <path d="M275 95 L290 155" stroke="#be185d" stroke-width="1.5" opacity="0.7"/>
  <path d="M325 95 L200 155" stroke="#7c3aed" stroke-width="1.5" opacity="0.7"/>
  
  <!-- From processing to fusion -->
  <path d="M110 195 L170 250" stroke="#3b82f6" stroke-width="1.5" opacity="0.7"/>
  <path d="M200 195 L200 250" stroke="#16a34a" stroke-width="1.5" opacity="0.7"/>
  <path d="M290 195 L230 250" stroke="#d97706" stroke-width="1.5" opacity="0.7"/>
  
  <!-- Processing capabilities -->
  <rect x="20" y="155" width="40" height="40" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="40" y="168" font-family="Arial, sans-serif" font-size="8" fill="#374151" text-anchor="middle" font-weight="600">AI能力</text>
  
  <circle cx="30" cy="175" r="2" fill="#3b82f6"/>
  <text x="35" y="178" font-family="Arial, sans-serif" font-size="6" fill="#374151">BERT</text>
  
  <circle cx="30" cy="182" r="2" fill="#16a34a"/>
  <text x="35" y="185" font-family="Arial, sans-serif" font-size="6" fill="#374151">YOLO</text>
  
  <circle cx="30" cy="189" r="2" fill="#d97706"/>
  <text x="35" y="192" font-family="Arial, sans-serif" font-size="6" fill="#374151">Transformer</text>
  
  <!-- Quality metrics -->
  <rect x="340" y="155" width="40" height="40" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="360" y="168" font-family="Arial, sans-serif" font-size="8" fill="#374151" text-anchor="middle" font-weight="600">准确率</text>
  
  <text x="345" y="178" font-family="Arial, sans-serif" font-size="6" fill="#3b82f6">文本: 96%</text>
  <text x="345" y="185" font-family="Arial, sans-serif" font-size="6" fill="#16a34a">图像: 94%</text>
  <text x="345" y="192" font-family="Arial, sans-serif" font-size="6" fill="#d97706">结构: 98%</text>
  
  <!-- Cross-modal connections visualization -->
  <g transform="translate(200, 257)">
    <circle cx="-25" cy="0" r="4" fill="#3b82f6" opacity="0.8"/>
    <circle cx="0" cy="0" r="4" fill="#16a34a" opacity="0.8"/>
    <circle cx="25" cy="0" r="4" fill="#d97706" opacity="0.8"/>
    
    <path d="M-21 0 L-4 0" stroke="#6b7280" stroke-width="1" opacity="0.6"/>
    <path d="M4 0 L21 0" stroke="#6b7280" stroke-width="1" opacity="0.6"/>
    <path d="M-25 -4 L0 4" stroke="#6b7280" stroke-width="1" opacity="0.4"/>
    <path d="M25 -4 L0 4" stroke="#6b7280" stroke-width="1" opacity="0.4"/>
  </g>
</svg>