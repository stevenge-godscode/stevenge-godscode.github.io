<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Data security and privacy protection architecture -->
  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="200" y="25" font-family="Arial, sans-serif" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="600">数据安全与隐私保护架构</text>
  
  <!-- Security perimeter -->
  <rect x="40" y="50" width="320" height="200" rx="12" fill="white" stroke="#ef4444" stroke-width="3" stroke-dasharray="10,5"/>
  <text x="50" y="70" font-family="Arial, sans-serif" font-size="10" fill="#ef4444" font-weight="600">安全边界 Security Perimeter</text>
  
  <!-- Access Control Layer -->
  <rect x="60" y="80" width="280" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="200" y="97" font-family="Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="600">访问控制层 (Access Control)</text>
  
  <!-- Access control components -->
  <rect x="80" y="105" width="60" height="12" fill="white" stroke="#dc2626" stroke-width="1"/>
  <text x="110" y="112" font-family="Arial, sans-serif" font-size="8" fill="#dc2626" text-anchor="middle">身份认证</text>
  
  <rect x="150" y="105" width="60" height="12" fill="white" stroke="#dc2626" stroke-width="1"/>
  <text x="180" y="112" font-family="Arial, sans-serif" font-size="8" fill="#dc2626" text-anchor="middle">权限管理</text>
  
  <rect x="220" y="105" width="60" height="12" fill="white" stroke="#dc2626" stroke-width="1"/>
  <text x="250" y="112" font-family="Arial, sans-serif" font-size="8" fill="#dc2626" text-anchor="middle">审计日志</text>
  
  <rect x="290" y="105" width="60" height="12" fill="white" stroke="#dc2626" stroke-width="1"/>
  <text x="320" y="112" font-family="Arial, sans-serif" font-size="8" fill="#dc2626" text-anchor="middle">行为监控</text>
  
  <!-- Encryption Layer -->
  <rect x="60" y="135" width="280" height="50" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="200" y="152" font-family="Arial, sans-serif" font-size="12" fill="#0284c7" text-anchor="middle" font-weight="600">加密保护层 (Encryption)</text>
  
  <!-- Encryption components -->
  <rect x="80" y="160" width="80" height="20" fill="white" stroke="#0284c7" stroke-width="1"/>
  <text x="120" y="168" font-family="Arial, sans-serif" font-size="9" fill="#0284c7" text-anchor="middle" font-weight="600">传输加密</text>
  <text x="120" y="177" font-family="Arial, sans-serif" font-size="7" fill="#374151" text-anchor="middle">TLS 1.3 / HTTPS</text>
  
  <rect x="170" y="160" width="80" height="20" fill="white" stroke="#0284c7" stroke-width="1"/>
  <text x="210" y="168" font-family="Arial, sans-serif" font-size="9" fill="#0284c7" text-anchor="middle" font-weight="600">存储加密</text>
  <text x="210" y="177" font-family="Arial, sans-serif" font-size="7" fill="#374151" text-anchor="middle">AES-256 / RSA</text>
  
  <rect x="260" y="160" width="80" height="20" fill="white" stroke="#0284c7" stroke-width="1"/>
  <text x="300" y="168" font-family="Arial, sans-serif" font-size="9" fill="#0284c7" text-anchor="middle" font-weight="600">密钥管理</text>
  <text x="300" y="177" font-family="Arial, sans-serif" font-size="7" fill="#374151" text-anchor="middle">HSM / KMS</text>
  
  <!-- Data Processing Layer -->
  <rect x="60" y="195" width="280" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="200" y="212" font-family="Arial, sans-serif" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="600">数据处理层 (Data Processing)</text>
  
  <!-- Processing components -->
  <rect x="80" y="220" width="60" height="12" fill="white" stroke="#16a34a" stroke-width="1"/>
  <text x="110" y="227" font-family="Arial, sans-serif" font-size="8" fill="#16a34a" text-anchor="middle">数据脱敏</text>
  
  <rect x="150" y="220" width="60" height="12" fill="white" stroke="#16a34a" stroke-width="1"/>
  <text x="180" y="227" font-family="Arial, sans-serif" font-size="8" fill="#16a34a" text-anchor="middle">隐私计算</text>
  
  <rect x="220" y="220" width="60" height="12" fill="white" stroke="#16a34a" stroke-width="1"/>
  <text x="250" y="227" font-family="Arial, sans-serif" font-size="8" fill="#16a34a" text-anchor="middle">数据隔离</text>
  
  <rect x="290" y="220" width="60" height="12" fill="white" stroke="#16a34a" stroke-width="1"/>
  <text x="320" y="227" font-family="Arial, sans-serif" font-size="8" fill="#16a34a" text-anchor="middle">安全沙箱</text>
  
  <!-- Deployment Options -->
  <rect x="20" y="140" width="30" height="80" fill="white" stroke="#f59e0b" stroke-width="2"/>
  <text x="35" y="155" font-family="Arial, sans-serif" font-size="9" fill="#f59e0b" text-anchor="middle" font-weight="600">部署</text>
  <text x="35" y="165" font-family="Arial, sans-serif" font-size="9" fill="#f59e0b" text-anchor="middle" font-weight="600">选项</text>
  
  <!-- Private cloud -->
  <rect x="25" y="175" width="20" height="10" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="35" y="182" font-family="Arial, sans-serif" font-size="6" fill="#d97706" text-anchor="middle">私有云</text>
  
  <!-- Hybrid cloud -->
  <rect x="25" y="190" width="20" height="10" fill="#e0f2fe" stroke="#0891b2" stroke-width="1"/>
  <text x="35" y="197" font-family="Arial, sans-serif" font-size="6" fill="#0891b2" text-anchor="middle">混合云</text>
  
  <!-- On-premise -->
  <rect x="25" y="205" width="20" height="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="35" y="212" font-family="Arial, sans-serif" font-size="6" fill="#7c3aed" text-anchor="middle">本地部署</text>
  
  <!-- Compliance Standards -->
  <rect x="370" y="140" width="25" height="80" fill="white" stroke="#8b5cf6" stroke-width="2"/>
  <text x="382" y="155" font-family="Arial, sans-serif" font-size="8" fill="#8b5cf6" text-anchor="middle" font-weight="600">合规</text>
  <text x="382" y="164" font-family="Arial, sans-serif" font-size="8" fill="#8b5cf6" text-anchor="middle" font-weight="600">标准</text>
  
  <text x="372" y="178" font-family="Arial, sans-serif" font-size="7" fill="#374151">ISO 27001</text>
  <text x="372" y="188" font-family="Arial, sans-serif" font-size="7" fill="#374151">SOC 2</text>
  <text x="372" y="198" font-family="Arial, sans-serif" font-size="7" fill="#374151">GDPR</text>
  <text x="372" y="208" font-family="Arial, sans-serif" font-size="7" fill="#374151">等保三级</text>
  
  <!-- Security shields visualization -->
  <g transform="translate(80, 260)">
    <!-- Shield 1 -->
    <path d="M0 0 L8 -5 L16 0 L16 10 L8 15 L0 10 Z" fill="#dc2626" opacity="0.8"/>
    <path d="M4 5 L7 8 L12 2" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    
    <!-- Shield 2 -->
    <path d="M25 0 L33 -5 L41 0 L41 10 L33 15 L25 10 Z" fill="#0284c7" opacity="0.8"/>
    <rect x="29" y="3" width="8" height="6" fill="white" rx="1"/>
    
    <!-- Shield 3 -->
    <path d="M50 0 L58 -5 L66 0 L66 10 L58 15 L50 10 Z" fill="#16a34a" opacity="0.8"/>
    <circle cx="58" cy="5" r="3" fill="white"/>
    <circle cx="58" cy="5" r="1" fill="#16a34a"/>
  </g>
  
  <text x="200" y="275" font-family="Arial, sans-serif" font-size="10" fill="#374151" text-anchor="middle" font-weight="600">多层安全防护机制</text>
  
  <!-- Data flow with security -->
  <g transform="translate(200, 100)">
    <!-- Secure data flow representation -->
    <path d="M-50 20 Q0 10 50 20" stroke="#6b7280" stroke-width="2" fill="none" opacity="0.3"/>
    <circle cx="-30" cy="18" r="2" fill="#dc2626"/>
    <circle cx="0" cy="15" r="2" fill="#0284c7"/>
    <circle cx="30" cy="18" r="2" fill="#16a34a"/>
    
    <!-- Lock icons -->
    <rect x="-32" y="25" width="4" height="3" fill="#dc2626" rx="0.5"/>
    <rect x="-31" y="23" width="2" height="2" fill="none" stroke="#dc2626" stroke-width="0.5" rx="1"/>
    
    <rect x="-2" y="25" width="4" height="3" fill="#0284c7" rx="0.5"/>
    <rect x="-1" y="23" width="2" height="2" fill="none" stroke="#0284c7" stroke-width="0.5" rx="1"/>
    
    <rect x="28" y="25" width="4" height="3" fill="#16a34a" rx="0.5"/>
    <rect x="29" y="23" width="2" height="2" fill="none" stroke="#16a34a" stroke-width="0.5" rx="1"/>
  </g>
</svg>