<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 全域知识关联技术 architecture visualization -->
  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="200" y="25" font-family="Arial, sans-serif" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="600">全域知识关联技术 可信推理架构</text>
  
  <!-- Knowledge Base Layer -->
  <rect x="50" y="50" width="300" height="60" rx="8" fill="white" stroke="#e5e7eb" stroke-width="2"/>
  <rect x="60" y="60" width="280" height="20" fill="#f3f4f6"/>
  <text x="200" y="73" font-family="Arial, sans-serif" font-size="12" fill="#374151" text-anchor="middle" font-weight="600">知识库层 (Knowledge Base)</text>
  
  <!-- Knowledge sources -->
  <rect x="70" y="85" width="60" height="20" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="100" y="97" font-family="Arial, sans-serif" font-size="9" fill="#3b82f6" text-anchor="middle">结构化数据</text>
  
  <rect x="140" y="85" width="60" height="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="170" y="97" font-family="Arial, sans-serif" font-size="9" fill="#16a34a" text-anchor="middle">文档知识</text>
  
  <rect x="210" y="85" width="60" height="20" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="240" y="97" font-family="Arial, sans-serif" font-size="9" fill="#d97706" text-anchor="middle">专家知识</text>
  
  <rect x="280" y="85" width="60" height="20" fill="#fce7f3" stroke="#be185d" stroke-width="1"/>
  <text x="310" y="97" font-family="Arial, sans-serif" font-size="9" fill="#be185d" text-anchor="middle">外部数据源</text>
  
  <!-- Graph Construction Layer -->
  <rect x="50" y="130" width="300" height="60" rx="8" fill="white" stroke="#e5e7eb" stroke-width="2"/>
  <rect x="60" y="140" width="280" height="20" fill="#f3f4f6"/>
  <text x="200" y="153" font-family="Arial, sans-serif" font-size="12" fill="#374151" text-anchor="middle" font-weight="600">图构建层 (Graph Construction)</text>
  
  <!-- Graph construction components -->
  <rect x="70" y="165" width="80" height="20" fill="#e0f2fe" stroke="#0891b2" stroke-width="1"/>
  <text x="110" y="177" font-family="Arial, sans-serif" font-size="9" fill="#0891b2" text-anchor="middle">实体识别</text>
  
  <rect x="160" y="165" width="80" height="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="200" y="177" font-family="Arial, sans-serif" font-size="9" fill="#16a34a" text-anchor="middle">关系抽取</text>
  
  <rect x="250" y="165" width="80" height="20" fill="#fefce8" stroke="#ca8a04" stroke-width="1"/>
  <text x="290" y="177" font-family="Arial, sans-serif" font-size="9" fill="#ca8a04" text-anchor="middle">图谱融合</text>
  
  <!-- Reasoning Layer -->
  <rect x="50" y="210" width="300" height="60" rx="8" fill="white" stroke="#e5e7eb" stroke-width="2"/>
  <rect x="60" y="220" width="280" height="20" fill="#f3f4f6"/>
  <text x="200" y="233" font-family="Arial, sans-serif" font-size="12" fill="#374151" text-anchor="middle" font-weight="600">推理层 (Reasoning Engine)</text>
  
  <!-- Reasoning components -->
  <rect x="70" y="245" width="70" height="20" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="105" y="257" font-family="Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle">路径查询</text>
  
  <rect x="150" y="245" width="70" height="20" fill="#f0f9ff" stroke="#0284c7" stroke-width="1"/>
  <text x="185" y="257" font-family="Arial, sans-serif" font-size="9" fill="#0284c7" text-anchor="middle">语义推理</text>
  
  <rect x="230" y="245" width="70" height="20" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="265" y="257" font-family="Arial, sans-serif" font-size="9" fill="#7c3aed" text-anchor="middle">可信验证</text>
  
  <!-- Arrows showing data flow -->
  <!-- From knowledge base to graph construction -->
  <path d="M200 110 L200 130" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- From graph construction to reasoning -->
  <path d="M200 190 L200 210" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Knowledge Graph visualization (right side) -->
  <g transform="translate(350, 120)">
    <!-- Central node -->
    <circle cx="0" cy="0" r="8" fill="#3b82f6"/>
    <text x="0" y="3" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">核心</text>
    
    <!-- Connected nodes -->
    <circle cx="-20" cy="-15" r="6" fill="#10b981"/>
    <text x="-20" y="-12" font-family="Arial, sans-serif" font-size="6" fill="white" text-anchor="middle">实体</text>
    
    <circle cx="20" cy="-15" r="6" fill="#f59e0b"/>
    <text x="20" y="-12" font-family="Arial, sans-serif" font-size="6" fill="white" text-anchor="middle">关系</text>
    
    <circle cx="-15" cy="20" r="6" fill="#ef4444"/>
    <text x="-15" y="23" font-family="Arial, sans-serif" font-size="6" fill="white" text-anchor="middle">属性</text>
    
    <circle cx="15" cy="20" r="6" fill="#8b5cf6"/>
    <text x="15" y="23" font-family="Arial, sans-serif" font-size="6" fill="white" text-anchor="middle">规则</text>
    
    <!-- Connections -->
    <path d="M-6 -6 L-14 -12" stroke="#6b7280" stroke-width="1"/>
    <path d="M6 -6 L14 -12" stroke="#6b7280" stroke-width="1"/>
    <path d="M-6 6 L-12 16" stroke="#6b7280" stroke-width="1"/>
    <path d="M6 6 L12 16" stroke="#6b7280" stroke-width="1"/>
  </g>
  
  <!-- Features on the left -->
  <rect x="20" y="120" width="25" height="80" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="32" y="135" font-family="Arial, sans-serif" font-size="8" fill="#374151" text-anchor="middle" font-weight="600">特性</text>
  
  <!-- Feature icons -->
  <circle cx="32" cy="145" r="3" fill="#10b981"/>
  <path d="M30 145 L31.5 146.5 L35 143" stroke="white" stroke-width="1" fill="none" stroke-linecap="round"/>
  <text x="32" y="155" font-family="Arial, sans-serif" font-size="6" fill="#374151" text-anchor="middle">可验证</text>
  
  <circle cx="32" cy="165" r="3" fill="#3b82f6"/>
  <rect x="30" y="163" width="4" height="4" fill="white"/>
  <text x="32" y="175" font-family="Arial, sans-serif" font-size="6" fill="#374151" text-anchor="middle">可追溯</text>
  
  <circle cx="32" cy="185" r="3" fill="#f59e0b"/>
  <path d="M30 183 L34 187 M30 187 L34 183" stroke="white" stroke-width="1"/>
  <text x="32" y="195" font-family="Arial, sans-serif" font-size="6" fill="#374151" text-anchor="middle">零幻觉</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>
</svg>