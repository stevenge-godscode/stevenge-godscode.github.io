<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆形 -->
  <circle cx="32" cy="32" r="30" fill="url(#gradient)" stroke="url(#borderGradient)" stroke-width="2"/>
  
  <!-- 主图标 - 知识网络节点 -->
  <g transform="translate(12, 12)">
    <!-- 中心节点 -->
    <circle cx="20" cy="20" r="4" fill="white" opacity="0.9"/>
    
    <!-- 周围节点 -->
    <circle cx="8" cy="8" r="2.5" fill="white" opacity="0.8"/>
    <circle cx="32" cy="8" r="2.5" fill="white" opacity="0.8"/>
    <circle cx="8" cy="32" r="2.5" fill="white" opacity="0.8"/>
    <circle cx="32" cy="32" r="2.5" fill="white" opacity="0.8"/>
    <circle cx="20" cy="4" r="2" fill="white" opacity="0.7"/>
    <circle cx="4" cy="20" r="2" fill="white" opacity="0.7"/>
    <circle cx="36" cy="20" r="2" fill="white" opacity="0.7"/>
    <circle cx="20" cy="36" r="2" fill="white" opacity="0.7"/>
    
    <!-- 连接线 -->
    <line x1="20" y1="20" x2="8" y2="8" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="20" y1="20" x2="32" y2="8" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="20" y1="20" x2="8" y2="32" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="20" y1="20" x2="32" y2="32" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="20" y1="20" x2="20" y2="4" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="20" y1="20" x2="4" y2="20" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="20" y1="20" x2="36" y2="20" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="20" y1="20" x2="20" y2="36" stroke="white" stroke-width="1.5" opacity="0.6"/>
    
    <!-- 次级连接 -->
    <line x1="8" y1="8" x2="20" y2="4" stroke="white" stroke-width="1" opacity="0.4"/>
    <line x1="32" y1="8" x2="20" y2="4" stroke="white" stroke-width="1" opacity="0.4"/>
    <line x1="8" y1="8" x2="4" y2="20" stroke="white" stroke-width="1" opacity="0.4"/>
    <line x1="32" y1="8" x2="36" y2="20" stroke="white" stroke-width="1" opacity="0.4"/>
  </g>
  
  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007AFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0051D0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#40A4FF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#007AFF;stop-opacity:0.8" />
    </linearGradient>
  </defs>
</svg>