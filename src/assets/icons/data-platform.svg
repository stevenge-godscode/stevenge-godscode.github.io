<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Clean security and data protection design -->
  <!-- Main server/database -->
  <rect x="22" y="20" width="20" height="28" rx="3" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  
  <!-- Data layers -->
  <rect x="24" y="24" width="16" height="4" rx="1" fill="#2563eb" opacity="0.3"/>
  <rect x="24" y="30" width="16" height="4" rx="1" fill="#2563eb" opacity="0.5"/>
  <rect x="24" y="36" width="16" height="4" rx="1" fill="#2563eb" opacity="0.7"/>
  <rect x="24" y="42" width="16" height="4" rx="1" fill="#2563eb" opacity="0.9"/>
  
  <!-- Security shield -->
  <path d="M32 12 L36 16 L32 20 L28 16 Z" fill="#2563eb" opacity="0.8"/>
  
  <!-- Lock in shield -->
  <rect x="30.5" y="15" width="3" height="2.5" rx="0.5" fill="white"/>
  <path d="M30 15 C30 13.9 30.9 13 32 13 S34 13.9 34 15" fill="none" stroke="white" stroke-width="1"/>
  
  <!-- Connection ports -->
  <circle cx="16" cy="28" r="2" fill="#2563eb" opacity="0.6"/>
  <circle cx="48" cy="28" r="2" fill="#2563eb" opacity="0.6"/>
  <circle cx="16" cy="40" r="2" fill="#2563eb" opacity="0.6"/>
  <circle cx="48" cy="40" r="2" fill="#2563eb" opacity="0.6"/>
  
  <!-- Secure connections -->
  <path d="M18 28 L22 28" stroke="#2563eb" stroke-width="2"/>
  <path d="M42 28 L46 28" stroke="#2563eb" stroke-width="2"/>
  <path d="M18 40 L22 40" stroke="#2563eb" stroke-width="2"/>
  <path d="M42 40 L46 40" stroke="#2563eb" stroke-width="2"/>
  
  <!-- Status indicators -->
  <circle cx="26" cy="26" r="1" fill="#10b981"/>
  <circle cx="26" cy="32" r="1" fill="#10b981"/>
  <circle cx="26" cy="38" r="1" fill="#10b981"/>
  <circle cx="26" cy="44" r="1" fill="#10b981"/>
</svg>