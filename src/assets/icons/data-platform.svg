<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dataGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00c6fb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main server/database -->
  <rect x="22" y="16" width="20" height="32" rx="2" fill="none" stroke="url(#dataGradient)" stroke-width="2.5"/>
  
  <!-- Server segments -->
  <rect x="24" y="20" width="16" height="6" rx="1" fill="url(#dataGradient)" opacity="0.3"/>
  <rect x="24" y="28" width="16" height="6" rx="1" fill="url(#dataGradient)" opacity="0.5"/>
  <rect x="24" y="36" width="16" height="6" rx="1" fill="url(#dataGradient)" opacity="0.7"/>
  
  <!-- Security shield -->
  <path d="M32 8 L36 12 L32 16 L28 12 Z" fill="url(#dataGradient)" opacity="0.8"/>
  <circle cx="32" cy="12" r="2" fill="white"/>
  
  <!-- Lock icon in shield -->
  <rect x="31" y="11" width="2" height="2" rx="0.3" fill="url(#dataGradient)"/>
  <path d="M30.5 11 C30.5 10.2 31.2 9.5 32 9.5 S33.5 10.2 33.5 11" fill="none" stroke="url(#dataGradient)" stroke-width="0.8"/>
  
  <!-- Data flow indicators -->
  <circle cx="16" cy="24" r="3" fill="url(#dataGradient)" opacity="0.6"/>
  <circle cx="48" cy="24" r="3" fill="url(#dataGradient)" opacity="0.6"/>
  <circle cx="16" cy="36" r="3" fill="url(#dataGradient)" opacity="0.6"/>
  <circle cx="48" cy="36" r="3" fill="url(#dataGradient)" opacity="0.6"/>
  
  <!-- Connection lines -->
  <path d="M19 24 L22 24" stroke="url(#dataGradient)" stroke-width="2" opacity="0.7"/>
  <path d="M42 24 L45 24" stroke="url(#dataGradient)" stroke-width="2" opacity="0.7"/>
  <path d="M19 36 L22 36" stroke="url(#dataGradient)" stroke-width="2" opacity="0.7"/>
  <path d="M42 36 L45 36" stroke="url(#dataGradient)" stroke-width="2" opacity="0.7"/>
  
  <!-- Network nodes -->
  <circle cx="8" cy="20" r="1.5" fill="url(#dataGradient)" opacity="0.5"/>
  <circle cx="8" cy="32" r="1.5" fill="url(#dataGradient)" opacity="0.5"/>
  <circle cx="8" cy="44" r="1.5" fill="url(#dataGradient)" opacity="0.5"/>
  <circle cx="56" cy="20" r="1.5" fill="url(#dataGradient)" opacity="0.5"/>
  <circle cx="56" cy="32" r="1.5" fill="url(#dataGradient)" opacity="0.5"/>
  <circle cx="56" cy="44" r="1.5" fill="url(#dataGradient)" opacity="0.5"/>
  
  <!-- Network connections -->
  <path d="M10 20 L13 22" stroke="url(#dataGradient)" stroke-width="1" opacity="0.4"/>
  <path d="M10 32 L13 34" stroke="url(#dataGradient)" stroke-width="1" opacity="0.4"/>
  <path d="M10 44 L13 40" stroke="url(#dataGradient)" stroke-width="1" opacity="0.4"/>
  <path d="M54 20 L51 22" stroke="url(#dataGradient)" stroke-width="1" opacity="0.4"/>
  <path d="M54 32 L51 34" stroke="url(#dataGradient)" stroke-width="1" opacity="0.4"/>
  <path d="M54 44 L51 40" stroke="url(#dataGradient)" stroke-width="1" opacity="0.4"/>
  
  <!-- Status indicators -->
  <circle cx="26" cy="22" r="1" fill="#00ff88"/>
  <circle cx="26" cy="30" r="1" fill="#00ff88"/>
  <circle cx="26" cy="38" r="1" fill="#00ff88"/>
  
  <!-- Data encryption indicators -->
  <rect x="36" y="21" width="2" height="2" rx="0.2" fill="white" opacity="0.8"/>
  <rect x="36" y="29" width="2" height="2" rx="0.2" fill="white" opacity="0.8"/>
  <rect x="36" y="37" width="2" height="2" rx="0.2" fill="white" opacity="0.8"/>
