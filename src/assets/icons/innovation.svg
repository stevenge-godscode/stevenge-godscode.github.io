  </defs>
  
  <!-- Lightbulb shape -->
  <circle cx="32" cy="24" r="12" fill="none" stroke="url(#innovationGradient)" stroke-width="2.5"/>
  
  <!-- Filament -->
  <path d="M26 24 Q32 20 38 24" fill="none" stroke="url(#innovationGradient)" stroke-width="1.5"/>
  <path d="M28 28 Q32 24 36 28" fill="none" stroke="url(#innovationGradient)" stroke-width="1.5"/>
  
  <!-- Base -->
  <rect x="28" y="36" width="8" height="4" rx="1" fill="url(#innovationGradient)"/>
  <rect x="29" y="40" width="6" height="2" rx="1" fill="url(#innovationGradient)" opacity="0.7"/>
  
  <!-- Innovation sparks -->
  <circle cx="20" cy="16" r="2" fill="url(#innovationGradient)" opacity="0.6"/>
  <circle cx="44" cy="18" r="1.5" fill="url(#innovationGradient)" opacity="0.6"/>
  <circle cx="48" cy="32" r="1.5" fill="url(#innovationGradient)" opacity="0.6"/>
  <circle cx="16" cy="32" r="2" fill="url(#innovationGradient)" opacity="0.6"/>
  
  <!-- Connection lines -->
  <path d="M22 18 L26 20" stroke="url(#innovationGradient)" stroke-width="1" opacity="0.4"/>
  <path d="M42 20 L38 22" stroke="url(#innovationGradient)" stroke-width="1" opacity="0.4"/>
  <path d="M46 32 L38 28" stroke="url(#innovationGradient)" stroke-width="1" opacity="0.4"/>
  <path d="M18 32 L26 28" stroke="url(#innovationGradient)" stroke-width="1" opacity="0.4"/>
  
  <!-- Knowledge graph nodes -->
  <circle cx="32" cy="48" r="3" fill="url(#innovationGradient)" opacity="0.8"/>
  <circle cx="24" cy="52" r="2" fill="url(#innovationGradient)" opacity="0.6"/>
  <circle cx="40" cy="52" r="2" fill="url(#innovationGradient)" opacity="0.6"/>
  
  <!-- Graph connections -->
  <path d="M32 48 L24 52" stroke="url(#innovationGradient)" stroke-width="1" opacity="0.4"/>
  <path d="M32 48 L40 52" stroke="url(#innovationGradient)" stroke-width="1" opacity="0.4"/>
