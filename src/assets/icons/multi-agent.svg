  <!-- Knowledge relationship indicators -->
  <rect x="14" y="14" width="4" height="2" fill="white"/>
  <rect x="46" y="14" width="4" height="2" fill="white"/>
  <rect x="14" y="46" width="4" height="2" fill="white"/>
  <rect x="46" y="46" width="4" height="2" fill="white"/>
  
