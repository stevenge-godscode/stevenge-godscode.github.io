  <circle cx="48" cy="16" r="6" fill="none" stroke="#2563eb" stroke-width="2"/>
  <circle cx="16" cy="48" r="6" fill="none" stroke="#2563eb" stroke-width="2"/>
  <circle cx="48" cy="48" r="6" fill="none" stroke="#2563eb" stroke-width="2"/>
  
  <!-- Secondary knowledge nodes -->
  <circle cx="32" cy="8" r="4" fill="#2563eb" opacity="0.6"/>
  <circle cx="8" cy="32" r="4" fill="#2563eb" opacity="0.6"/>
  <circle cx="56" cy="32" r="4" fill="#2563eb" opacity="0.6"/>
  <circle cx="32" cy="56" r="4" fill="#2563eb" opacity="0.6"/>
  
  <!-- Primary connections to center -->
  <path d="M24 24 L24 24" stroke="#2563eb" stroke-width="2"/>
  <path d="M22 22 L26 26" stroke="#2563eb" stroke-width="2"/>
  <path d="M40 22 L38 26" stroke="#2563eb" stroke-width="2"/>
