  const extraStyle=`<style>

</style>`;
  const headPos=next.lastIndexOf('</head>');
  if(headPos>=0) next=next.slice(0,headPos)+extraStyle+next.slice(headPos);

  const runtime='<script>(()=>{function init(){const NAV_H=48;const use=document.getElementById("use");const caseEl=use&&use.querySelector(".case");if(use&&caseEl&&!document.getElementById("scenario")){use.insertAdjacentHTML("afterend",`<section class="chapter scenario-chapter" id="scenario"><div class="shell chapter-inner"><div class="chapter-divider"><span class="chapter-num">04</span><span class="chapter-line"></span><span class="chapter-label">BUSINESS SCENARIO</span></div><div class="chapter-head"><h2>把地图用在真实业务里</h2><p>从业务事实到判断和行动</p></div><div id="case-mount"></div></div></section>`);document.getElementById("case-mount").replaceWith(caseEl)}const navright=document.querySelector(".navright");if(navright){navright.querySelectorAll("a:not(.contact)").forEach(a=>a.remove())}const ids=["top","blind","build","use","scenario"];const sections=ids.map(id=>document.getElementById(id)).filter(Boolean);const closing=document.querySelector(".closing");if(closing)sections.push(closing);sections.forEach(el=>el.classList.add("snap-page"));const dotDefs=[["blind","AI 看到的是局部 不是全景"],["build","为 AI 绘制可信的业务地图"],["use","AI 有了地图才知道该怎么做"],["scenario","把地图用在真实业务里"]];if(!document.querySelector(".page-dots")){const rail=document.createElement("div");rail.className="page-dots";rail.setAttribute("aria-label","章节导航");dotDefs.forEach(([id,label])=>{const b=document.createElement("button");b.className="page-dot";b.type="button";b.dataset.target=id;b.setAttribute("aria-label",label);b.innerHTML=`<span class="page-dot-label">${label}</span>`;rail.appendChild(b)});document.body.appendChild(rail)}const dots=[...document.querySelectorAll(".page-dot")];const cards=[...document.querySelectorAll(".triptych>section")];const cardTargets=["blind","build","use"];const cardLabels=["AI 看到的是局部 不是全景","为 AI 绘制可信的业务地图","AI 有了地图才知道该怎么做"];const desktop=window.matchMedia("(min-width:1101px)");const targetY=el=>Math.max(0,Math.round(el.getBoundingClientRect().top+window.scrollY-NAV_H));const nearest=()=>{let best=0,dist=Infinity;sections.forEach((el,i)=>{const d=Math.abs(window.scrollY-targetY(el));if(d<dist){dist=d;best=i}});return best};let locked=false;let wheelAccum=0;let raf=0;const syncDots=()=>{raf=0;const current=sections[nearest()];dots.forEach(d=>d.classList.toggle("active",current&&d.dataset.target===current.id))};const requestSync=()=>{if(!raf)raf=requestAnimationFrame(syncDots)};const goIndex=i=>{const n=Math.max(0,Math.min(sections.length-1,i));locked=true;wheelAccum=0;window.scrollTo({top:targetY(sections[n]),behavior:"smooth"});setTimeout(()=>{window.scrollTo({top:targetY(sections[n]),behavior:"auto"});locked=false;syncDots()},560)};const go=dir=>goIndex(nearest()+dir);dots.forEach(d=>d.addEventListener("click",()=>{const i=sections.findIndex(s=>s.id===d.dataset.target);if(i>=0)goIndex(i)}));cards.slice(0,3).forEach((card,i)=>{card.setAttribute("role","link");card.setAttribute("tabindex","0");card.setAttribute("aria-label",cardLabels[i]);const jump=()=>{const target=document.getElementById(cardTargets[i]);if(target)goIndex(sections.indexOf(target))};card.addEventListener("click",jump);card.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();jump()}})});window.addEventListener("wheel",e=>{if(!desktop.matches||e.ctrlKey)return;e.preventDefault();if(locked)return;wheelAccum+=e.deltaY;if(Math.abs(wheelAccum)<18)return;go(wheelAccum>0?1:-1)},{passive:false});window.addEventListener("keydown",e=>{if(!desktop.matches||/INPUT|TEXTAREA|SELECT/.test(document.activeElement&&document.activeElement.tagName))return;if(["ArrowDown","PageDown"].includes(e.key)||(e.key===" "&&!e.shiftKey)){e.preventDefault();go(1)}else if(["ArrowUp","PageUp"].includes(e.key)||(e.key===" "&&e.shiftKey)){e.preventDefault();go(-1)}});window.addEventListener("scroll",requestSync,{passive:true});window.addEventListener("resize",()=>{if(desktop.matches){const i=nearest();window.scrollTo({top:targetY(sections[i]),behavior:"auto"})}syncDots()});setTimeout(()=>{if(desktop.matches){const i=nearest();window.scrollTo({top:targetY(sections[i]),behavior:"auto"})}syncDots()},80)}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init()})();<'+'/script>';
  const bodyPos=next.lastIndexOf('</body>');
  if(bodyPos>=0) next=next.slice(0,bodyPos)+runtime+next.slice(bodyPos);
  document.open();document.write(next);document.close();
})().catch(()=>{document.getElementById('loading').textContent='页面加载失败';});
