<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<link rel="icon" type="image/png" sizes="32x32" href="src/assets/images/logo_256.png?v=prod">
<link rel="shortcut icon" href="src/assets/images/logo_256.png?v=prod">
<link rel="apple-touch-icon" href="src/assets/images/logo_256.png?v=prod">
<title>Genesis · 让 AI 真正为你的公司工作</title>
<style>html,body{margin:0;min-height:100%;background:#fff}#loading{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#6b7280;text-align:center;padding:48px 20px;font-size:14px}</style>
</head>
<body>
<div id="loading">Genesis</div>
<script>
(async()=>{
  let next=await fetch('apple-style-preview-v47.html?v=production-20260903-5',{cache:'no-store'}).then(r=>r.text());
  const replacements=[
    ['<title>Genesis V47</title>','<title>Genesis · 让 AI 真正为你的公司工作</title>'],
    ['AI 真正缺的是一张企业实时业务地图','AI 需要的是一张企业实时业务地图'],
    ['AI 看不见企业里的真实业务','AI 看到的是局部 不是全景'],
    ['数据在系统里 规则在文档里 经验在人脑里 对 AI 来说仍是零散片段','信息分散 · 关系不明 · 状态不清 · 依据难追'],
    ['Genesis 画出企业自己的业务地图','为 AI 绘制可信的业务地图'],
    ['把业务结构 当前事实 企业规则和工作方式放到同一张持续更新的地图里','完整 · 实时 · 有据 · 可追溯'],
    ['AI 有了地图才能真正做事','AI 有了地图才知道该怎么做'],
    ['看清现状 找到依据 选择路径 执行动作 再看结果','看清现状 · 理解关系 · 做出判断 · 找到路径'],
    ['<div class="map-output"><img src="src/assets/images/logo_256.png" alt="Genesis"><b>AI 可用的实时业务地图</b></div>',''],
    ['>联系<','>联系我们<'],
    ['Genesis V47 Preview','Genesis']
  ];
  for(const [from,to] of replacements) next=next.split(from).join(to);
  const css='<link rel="stylesheet" href="homepage-production.css?v=20260903-2">';
  const js='<script src="homepage-production.js?v=20260903-1"></'+'script>';
  const headPos=next.lastIndexOf('</head>');
  if(headPos>=0) next=next.slice(0,headPos)+css+next.slice(headPos);
  const bodyPos=next.lastIndexOf('</body>');
  if(bodyPos>=0) next=next.slice(0,bodyPos)+js+next.slice(bodyPos);
  document.open();
  document.write(next);
  document.close();
})().catch(()=>{document.getElementById('loading').textContent='页面加载失败';});
</script>
</body>
</html>
