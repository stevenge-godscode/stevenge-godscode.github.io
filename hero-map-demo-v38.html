<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}.shell{width:min(1460px,calc(100% - 48px));margin:auto}img{display:block}
nav{height:48px;background:rgba(255,255,255,.94);border-bottom:1px solid rgba(0,0,0,.05);backdrop-filter:blur(18px);position:sticky;top:0;z-index:50}.navin{height:100%;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:7px;font-size:18px;font-weight:650}.brand img{width:22px;height:22px;border-radius:4px}.contact{font-size:12px;background:#1677ff;color:#fff;padding:6px 12px;border-radius:999px;text-decoration:none}
.hero{background:#fff;padding:62px 0 48px;text-align:center}.hero h1{margin:0;font-size:clamp(42px,4.5vw,64px);line-height:1.04;letter-spacing:-.034em;font-weight:680;white-space:nowrap}.stage{margin:40px auto 0;background:#fff;border:1px solid #e1e6ec;border-radius:18px;box-shadow:0 18px 55px rgba(31,45,61,.08);padding:20px;overflow:hidden}.triptych{display:grid;grid-template-columns:1fr 64px 1.12fr 64px 1fr;align-items:center}.arrow{font-size:34px;color:#adb6c1;font-weight:300}.panel-sentence{font-size:16px;line-height:1.4;font-weight:670;margin:0 0 12px}.map-card{height:350px;border-radius:16px;overflow:hidden;border:1px solid #dde4ea;position:relative;background:#edf2f5}.map-svg{position:absolute;inset:0;width:100%;height:100%}

.dark-map{background:#17222d;border-color:#253441}.dark-map .map-svg{filter:grayscale(1) brightness(.39) contrast(.9);opacity:.72}.dark-map:after{content:"";position:absolute;inset:0;background:rgba(9,16,24,.42);pointer-events:none}.ai-beacon{position:absolute;z-index:7;width:42px;height:42px;border-radius:11px;background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;box-shadow:0 0 0 1px rgba(255,255,255,.04),0 3px 14px rgba(0,0,0,.18)}.ai-beacon img{width:21px;height:21px;filter:grayscale(1) brightness(1.2);opacity:.85}.ai-beacon:before{content:"";position:absolute;width:112px;height:112px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14) 0%,rgba(255,255,255,.07) 28%,rgba(255,255,255,.025) 52%,transparent 72%);z-index:-1;pointer-events:none}.b1{left:12%;top:15%}.b2{right:14%;top:23%}.b3{left:23%;bottom:17%}.b4{right:27%;bottom:12%}.tiny-visible{position:absolute;z-index:6;width:72px;height:2px;background:rgba(205,218,229,.22);border-radius:4px}.t1{left:9%;top:25%;transform:rotate(-24deg)}.t2{right:11%;top:33%;transform:rotate(18deg)}.t3{left:20%;bottom:27%;transform:rotate(31deg)}.t4{right:24%;bottom:22%;transform:rotate(-17deg)}

.genesis-badge{position:absolute;z-index:12;left:50%;top:15px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.96);border:1px solid rgba(0,0,0,.06);border-radius:12px;padding:8px 13px;box-shadow:0 6px 22px rgba(30,50,70,.08);font-size:17px;font-weight:680}.genesis-badge img{width:25px;height:25px;border-radius:5px}.layer-pill{position:absolute;z-index:10;left:16px;background:rgba(255,255,255,.96);border:1px solid rgba(0,0,0,.06);border-radius:999px;padding:7px 10px;font-size:10px;font-weight:630;box-shadow:0 4px 14px rgba(35,55,75,.06);display:flex;align-items:center;gap:6px}.layer-pill i{width:8px;height:8px;border-radius:50%;display:block}.l1{top:67px;color:#2d66ad}.l1 i{background:#2f78df}.l2{top:106px;color:#2d7d8b}.l2 i{background:#36a6bd}.l3{top:145px;color:#3f7a50}.l3 i{background:#4eaf70}.l4{top:184px;color:#5b51a6}.l4 i{background:#6a60db}.signal{position:absolute;z-index:8;border-radius:8px;background:rgba(255,255,255,.94);border:1px solid rgba(0,0,0,.06);box-shadow:0 4px 13px rgba(40,60,80,.06);padding:6px 8px;font-size:9px;font-weight:630}.s1{right:18px;top:72px;color:#2d66ad}.s2{right:54px;top:119px;color:#9b651f}.s3{right:16px;top:169px;color:#b14545}.s4{right:54px;bottom:26px;color:#4e4ca5}.node-dot{position:absolute;z-index:8;width:12px;height:12px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.08)}.n1{left:42%;top:30%;background:#347de0}.n2{left:58%;top:46%;background:#4eaf70}.n3{left:47%;top:64%;background:#6a60db}.n4{left:68%;top:72%;background:#f28a23}.edge{position:absolute;height:3px;background:#91a7ba;border-radius:4px;transform-origin:left center;z-index:7;opacity:.95}.e1{left:43%;top:32%;width:108px;transform:rotate(25deg)}.e2{left:58%;top:48%;width:92px;transform:rotate(132deg)}.e3{left:48%;top:65%;width:128px;transform:rotate(11deg)}

.nav-map{background:#edf3f6}.traffic-card{position:absolute;z-index:11;left:16px;top:15px;background:rgba(255,255,255,.96);border:1px solid rgba(0,0,0,.06);border-radius:12px;padding:10px 12px;box-shadow:0 5px 18px rgba(30,50,70,.07);text-align:left;font-size:9.5px;line-height:1.65;color:#5e6872}.traffic-card b{display:block;font-size:11px;color:#273444;margin-bottom:3px}.legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.ok{background:#38a86d}.warn{background:#f29a30}.risk{background:#d84d4d}.evidence{position:absolute;z-index:11;right:14px;top:16px;background:rgba(255,255,255,.96);border:1px solid rgba(0,0,0,.06);border-radius:12px;padding:10px 11px;box-shadow:0 5px 18px rgba(30,50,70,.07);text-align:left;font-size:9.2px;line-height:1.65;color:#64707b}.evidence b{display:block;font-size:10.5px;color:#2b3d4d;margin-bottom:3px}.route{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.r1{stroke:#2f78df}.r2{stroke:#48a66e}.r3{stroke:#6a60db}.r4{stroke:#f28a23}.route-shadow{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;opacity:.8}.traffic-orange{stroke:#f29a30;stroke-width:7}.traffic-red{stroke:#d84d4d;stroke-width:7}.ai-runner{position:absolute;z-index:12;width:36px;height:36px;border-radius:10px;background:#fff;border:1px solid rgba(0,0,0,.06);display:grid;place-items:center;box-shadow:0 5px 16px rgba(30,50,70,.11)}.ai-runner img{width:19px;height:19px}.run1{left:16%;top:67%}.run2{left:39%;top:27%}.run3{left:54%;top:69%}.run4{right:15%;top:46%}.dest{position:absolute;z-index:10;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.96);border:1px solid rgba(0,0,0,.06);border-radius:999px;padding:6px 8px;font-size:9px;font-weight:650;box-shadow:0 4px 12px rgba(30,50,70,.06)}.dest i{width:9px;height:9px;border-radius:50%;display:block}.d1{left:31%;top:18%;color:#2e67ad}.d1 i{background:#2f78df}.d2{right:28%;top:22%;color:#3f7a50}.d2 i{background:#48a66e}.d3{right:32%;bottom:12%;color:#5c51a8}.d3 i{background:#6a60db}.d4{right:5%;bottom:20%;color:#9c621e}.d4 i{background:#f28a23}.event-pin{position:absolute;z-index:9;width:12px;height:12px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.06)}.p1{left:46%;top:51%;background:#f29a30}.p2{right:29%;top:56%;background:#d84d4d}.p3{left:30%;bottom:18%;background:#38a86d}
