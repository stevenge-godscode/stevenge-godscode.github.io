<!doctype html>

<style>
:root{--ink:#172033;--sub:#6b7280;--blue:#1677ff;--green:#32a06a;--orange:#f28a23;--red:#d84b4b;--purple:#6757d8;--line:#dfe5ec;--bg:#f6f7f9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}.shell{width:min(1460px,calc(100% - 48px));margin:auto}img{display:block}a{text-decoration:none;color:inherit}
nav{height:48px;background:rgba(255,255,255,.94);border-bottom:1px solid rgba(0,0,0,.05);backdrop-filter:blur(18px);position:sticky;top:0;z-index:50}.navin{height:100%;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:7px;font-size:18px;font-weight:650}.brand img{width:22px;height:22px;border-radius:4px}.contact{font-size:12px;background:var(--blue);color:#fff;padding:6px 12px;border-radius:999px}
.hero{background:#fff;padding:62px 0 48px;text-align:center}.hero h1{margin:0;font-size:clamp(42px,4.5vw,64px);line-height:1.04;letter-spacing:-.034em;font-weight:680;white-space:nowrap}.stage{margin:40px auto 0;background:#fff;border:1px solid #e1e6ec;border-radius:18px;box-shadow:0 18px 55px rgba(31,45,61,.08);padding:20px;overflow:hidden}.triptych{display:grid;grid-template-columns:1fr 64px 1.12fr 64px 1fr;align-items:center}.arrow{font-size:34px;color:#adb6c1;font-weight:300}.panel-sentence{font-size:16px;line-height:1.45;font-weight:670;margin:0 0 14px;min-height:46px;display:flex;align-items:center;justify-content:center}.map-card{height:360px;border-radius:16px;overflow:hidden;border:1px solid #dde4ea;position:relative;background:#edf2f5}.map-svg{position:absolute;inset:0;width:100%;height:100%}
.road-major{fill:none;stroke:#cfd7df;stroke-width:9;stroke-linecap:round}.road-minor{fill:none;stroke:#dfe5ea;stroke-width:4;stroke-linecap:round}.road-thin{fill:none;stroke:#e9edf1;stroke-width:2}.water{fill:#dceaf2}.block{fill:#f8fafb;stroke:#e5eaee;stroke-width:1}
/* panel 1 */
.dark-map{background:#16212b;border-color:#253441}.dark-map .base{filter:grayscale(1) brightness(.3) contrast(.9);opacity:.63}.dark-map:after{content:"";position:absolute;inset:0;background:rgba(6,12,18,.47);pointer-events:none}.ai-lantern{position:absolute;z-index:8;width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.24);display:grid;place-items:center;box-shadow:0 4px 18px rgba(0,0,0,.26)}.ai-lantern img{width:22px;height:22px;filter:grayscale(1) brightness(1.2);opacity:.9}.ai-lantern:before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;z-index:-2;background:radial-gradient(circle,rgba(255,255,255,.23) 0%,rgba(238,246,252,.14) 24%,rgba(205,223,236,.075) 44%,rgba(166,194,215,.025) 62%,transparent 76%);filter:blur(2px);pointer-events:none}.ai-lantern:after{content:"";position:absolute;width:132px;height:132px;border-radius:50%;z-index:-1;background:radial-gradient(circle,rgba(255,255,255,.11),rgba(255,255,255,.035) 55%,transparent 75%);pointer-events:none}.chat-lantern{left:15%;top:19%}.ds-lantern{right:18%;bottom:17%}

.nav-map{background:#edf3f6}.nav-legend{position:absolute;z-index:13;left:14px;top:14px;background:rgba(255,255,255,.96);border:1px solid rgba(0,0,0,.055);border-radius:11px;padding:9px 11px;box-shadow:0 5px 15px rgba(30,50,70,.06);text-align:left;font-size:9px;line-height:1.7;color:#66717b}.nav-legend b{display:block;font-size:10.5px;color:#2e3d4c;margin-bottom:2px}.legend-line{display:inline-block;width:23px;height:0;border-top:4px solid #2f78df;border-radius:4px;margin-right:6px;vertical-align:middle}.legend-reason{display:inline-block;width:23px;height:0;border-top:2px dashed #6f7f8d;margin-right:6px;vertical-align:middle}.traffic-card{position:absolute;z-index:12;right:14px;top:14px;background:rgba(255,255,255,.96);border:1px solid rgba(0,0,0,.055);border-radius:11px;padding:9px 10px;box-shadow:0 5px 15px rgba(30,50,70,.06);text-align:left;font-size:8.8px;line-height:1.65;color:#63707b}.traffic-card b{display:block;font-size:10px;color:#2d3c49;margin-bottom:2px}.legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.ok{background:#39a86d}.warn{background:#f29a30}.risk{background:#d84d4d}
.action-route{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.route-chat{stroke:#2f78df}.route-ds{stroke:#6757d8}.route-under{fill:none;stroke:#fff;stroke-width:12;stroke-linecap:round;stroke-linejoin:round;opacity:.9}.reason-path{fill:none;stroke:#7f8d98;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 5;opacity:.9}.reason-chat{stroke:#6d8fb5}.reason-ds{stroke:#877fc1}.traffic-orange{fill:none;stroke:#f29a30;stroke-width:9;stroke-linecap:round}.traffic-red{fill:none;stroke:#d84d4d;stroke-width:9;stroke-linecap:round}
