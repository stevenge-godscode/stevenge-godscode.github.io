<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Genesis V48</title>
<style>html,body{margin:0;min-height:100%;background:#fff}#loading{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#6b7280;text-align:center;padding:48px 20px;font-size:14px}</style>
</head>
<body>
<div id="loading">Genesis</div>
<script>
(async()=>{
  const html=await fetch('apple-style-preview-v47.html?v=48',{cache:'no-store'}).then(r=>r.text());
  const replacements=[
    ['<title>Genesis V47</title>','<title>Genesis V48</title>'],
    ['数据在系统里 规则在文档里 经验在人脑里 对 AI 来说仍是零散片段','信息散落各处 AI 看不见全貌'],
    ['Genesis 画出企业自己的业务地图','Genesis 把企业业务变成 AI 看得懂的地图'],
    ['AI 有了地图才能真正做事','AI 有了地图才知道该怎么做'],
    ['Genesis V47 Preview','Genesis V48 Preview']
  ];
  let next=html;
  for(const [from,to] of replacements) next=next.split(from).join(to);
  document.open();document.write(next);document.close();
})().catch(()=>{document.getElementById('loading').textContent='页面加载失败';});
</script>
</body>
</html>
