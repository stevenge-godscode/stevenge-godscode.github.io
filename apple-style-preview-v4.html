<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Genesis · Apple-style Preview v4</title>
<style>html,body{margin:0;background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}.loading{height:100vh;display:grid;place-items:center;color:#86868b;font-size:14px}</style>
</head>
<body><div class="loading">Loading preview…</div>
<script>
(async()=>{
 const r=await fetch('apple-style-preview.html?v=2',{cache:'no-store'});
 let html=await r.text();
 const css=`<style id="apple-layout-v4">
 /* v4 — Apple homepage inspired proportion, rhythm and Chinese typography */
 :root{--max:1280px}
 h1,h2{font-weight:650;letter-spacing:-.024em}
 .global-nav{height:46px;background:rgba(250,250,252,.88)}
 .brand{font-size:12px;font-weight:600}.brand img{width:22px;height:22px;border-radius:5px}
 .nav-links{gap:30px}.nav-action{padding:6px 13px}
 .billboard+.billboard{margin-top:12px}
 .eyebrow{font-size:16px;font-weight:600;letter-spacing:-.008em;margin-bottom:12px}
 .section-kicker{font-size:17px;font-weight:600;letter-spacing:-.008em;margin-bottom:13px}
 .lead{max-width:650px;margin-top:17px;font-size:clamp(18px,1.55vw,21px);line-height:1.45;font-weight:450;letter-spacing:-.008em}
 .ctas{margin-top:19px;gap:25px}.cta-link{font-size:16px}

 /* Hero — shorter copy block, significantly larger visual */
 .hero{min-height:790px;padding:68px 0 18px}
 .hero h1{font-size:clamp(48px,5.15vw,66px);line-height:1.09;max-width:820px}
 .hero-art{width:min(1260px,100%);height:475px;margin:26px auto 0}
 .hero-glow{width:900px;height:440px;opacity:.82}
 .flow-stage{inset:18px 16px;grid-template-columns:1fr .86fr 1fr;gap:24px}
 .flow-item{min-height:78px;border-radius:20px;padding:17px 19px;box-shadow:0 12px 32px rgba(29,43,75,.055)}
 .flow-item b{font-size:15px}.pack-slot{padding:30px 26px;border-radius:28px;box-shadow:0 24px 50px rgba(25,38,68,.16)}

 /* Intro — one clean statement, visual gets the space */
 .intro{min-height:680px;padding:82px 0 54px}
 .intro h2{font-size:clamp(40px,4.2vw,54px);line-height:1.11}
 .intro .lead{max-width:650px;color:#a1a1a6}
 .intro-visual{width:min(1160px,100%);margin-top:44px;gap:12px}
 .intro-node{height:205px;border-radius:28px;padding:26px}.intro-node.center{height:250px}
 .intro-node strong{font-size:23px}.intro-node span{font-size:12px}

 /* Section labels intentionally smaller — not every section is a hero */
 .scenes-title{padding:76px 0 38px}
 .scenes-title h2{font-size:clamp(34px,3.5vw,44px);line-height:1.12}
 .scene{min-height:auto;padding:72px 0 40px}
 .scene .section-head{max-width:760px;margin-inline:auto}
 .scene .section-head h2{font-size:clamp(40px,4.35vw,56px);line-height:1.11;letter-spacing:-.024em}
 .scene .section-sub{margin-top:15px;font-size:clamp(17px,1.45vw,20px);line-height:1.45;font-weight:450;letter-spacing:-.006em}
 .scene-tags{margin-top:18px}
 .product-stage{width:min(1280px,calc(100% - 24px));margin-top:36px;border-radius:30px;box-shadow:0 22px 60px rgba(33,51,92,.11)}
 .ops-stage{box-shadow:0 22px 60px rgba(0,0,0,.38)}
 .seek-body{min-height:610px}.ops-body{min-height:620px}
 .window-bar{height:52px}
 .market-view,.recommendation,.ops-detail{padding:38px}
 .market-info h3,.ops-detail h3{font-size:32px;line-height:1.12;letter-spacing:-.018em}
 .chart{top:125px;height:350px}
 .market-points{bottom:32px}

 /* Architecture — less card-wall, more single-stage feeling */
 .architecture{padding:82px 0 70px}
 .architecture h2{font-size:clamp(40px,4.25vw,54px);line-height:1.11}
 .architecture .lead{max-width:660px}
 .architecture-stage{width:min(1260px,100%);margin-top:42px;padding:26px;border-radius:30px;box-shadow:0 18px 50px rgba(27,39,70,.055)}
 .arch-main{gap:7px}.arch-block{min-height:250px;border-radius:19px;padding:20px}
 .arch-block strong{font-size:19px}.arch-block span{font-size:11px}
 .integration-note{margin-top:19px}.lanes{margin-top:16px}

 /* Components — Apple-like large tiles with image-dominant lower half */
 .components{padding:82px 0 74px}
 .components h2{font-size:clamp(34px,3.5vw,44px);line-height:1.12}
 .component-grid{width:min(1260px,100%);margin-top:42px;gap:12px}
 .component-card{min-height:500px;border-radius:30px;padding:34px}
 .component-card h3{font-size:29px;line-height:1.13;letter-spacing:-.018em;font-weight:650}
 .component-card p{font-size:16px;line-height:1.46;max-width:390px;margin-top:9px}
 .component-visual{left:28px;right:28px;bottom:26px;height:285px;border-radius:22px}

 /* Closing deliberately quieter */
 .closing{min-height:470px;padding:70px 0}
 .closing h2{font-size:clamp(38px,4.15vw,52px);line-height:1.12}
 .closing p{font-size:19px;line-height:1.45;margin-top:16px}

 /* Softer motion — content, not animation, stays primary */
 .reveal{transform:translateY(18px);transition:opacity .72s var(--ease),transform .72s var(--ease)}

 @media(max-width:950px){
   .hero{min-height:auto}.hero-art{height:auto}.flow-stage{position:relative;inset:auto;padding:24px 18px}
   .intro-visual{grid-template-columns:1fr}.intro-node,.intro-node.center{height:150px}
   .product-stage{width:calc(100% - 20px)}
 }
 @media(max-width:620px){
   .shell{width:calc(100% - 32px)}
   .hero{padding:52px 0 14px}.eyebrow{font-size:14px}.hero h1{font-size:36px;line-height:1.14;letter-spacing:-.016em;max-width:360px}.lead{font-size:17px;line-height:1.48;max-width:340px;margin-top:14px}.ctas{margin-top:16px}.cta-link{font-size:15px}
   .hero-art{margin-top:20px}.flow-stage{padding:14px 6px;gap:8px}.flow-item{min-height:60px;border-radius:15px;padding:13px 14px}.flow-item b{font-size:13px}.pack-slot{padding:20px;border-radius:20px}.pack-slot strong{font-size:20px}
   .intro,.scene,.architecture,.components{padding:60px 0 36px}.intro h2,.scene .section-head h2,.architecture h2{font-size:31px;line-height:1.16;letter-spacing:-.016em}.scenes-title h2,.components h2{font-size:28px;line-height:1.16}.section-kicker{font-size:14px}.scene .section-sub{font-size:16px;line-height:1.5}.scenes-title{padding:58px 0 28px}
   .intro-visual{margin-top:30px}.intro-node,.intro-node.center{height:125px;border-radius:21px;padding:20px}.intro-node strong{font-size:20px}
   .product-stage{width:calc(100% - 12px);margin-top:28px;border-radius:22px}.window-bar{height:46px;padding:0 16px}.market-view,.recommendation,.ops-list,.ops-detail{padding:20px}.market-view{min-height:540px}.chart{top:112px;height:285px}.market-points{margin-top:300px}.market-info h3,.ops-detail h3{font-size:25px}.recommendation .rec{font-size:23px}
   .architecture-stage{width:calc(100% + 8px);margin-left:-4px;margin-top:28px;padding:12px;border-radius:22px}.arch-block{min-height:125px;padding:17px}.arch-block strong{font-size:18px}.lanes{gap:7px}
   .component-grid{width:calc(100% + 8px);margin-left:-4px;margin-top:28px}.component-card{min-height:410px;padding:25px;border-radius:24px}.component-card h3{font-size:25px}.component-card p{font-size:15px}.component-visual{left:18px;right:18px;bottom:18px;height:245px;border-radius:18px}
   .closing{min-height:390px;padding:58px 0}.closing h2{font-size:31px;line-height:1.16}.closing p{font-size:16px;max-width:330px}
 }
 </style>`;
 html=html.replace('</head>',css+'</head>')
   .replace('Apple-style Preview v2','Apple-style Preview v4')
   .replace('Apple-style experiment · v2','Apple-style layout · v4');
 document.open();document.write(html);document.close();
})().catch(()=>{document.body.innerHTML='<div class="loading">Preview failed to load</div>'});
</script></body></html>
